<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIZABITCOIN LOCAL-FIREBASE</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent-color: #f7931a; --sidebar-bg: #252525; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 300px; background-color: var(--sidebar-bg); border-right: 2px solid var(--accent-color); padding: 20px; box-sizing: border-box; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .header-actions { position: absolute; top: 20px; right: 20px; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #lizaButton { width: 200px; height: 200px; border-radius: 50%; font-size: 2rem; margin-top: 20px; }
        .info-text { margin-top: 20px; color: #666; text-align: center; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul id="userList"><li>Connect wallet...</li></ul>
    </div>

    <div class="main-content">
        <div class="header-actions">
            <button id="connectWallet" onclick="connectMetaMask()">Connect MetaMask</button>
        </div>
        <div>
            <h2>Balance: <span id="balanceDisplay">0.00</span> LIZA</h2>
            <p>Total Supply: <span id="supplyDisplay">0</span> / 21,000,000</p>
        </div>
        <button id="lizaButton" onclick="handleTap()" disabled>LIZA</button>
        <div id="statusMessage" class="info-text">Инициализация модулей...</div>
    </div>

    <script>
        // Загружаем Firebase динамически через Fetch, чтобы обойти любые MIME-блокировки браузеров
        async function loadFirebaseLocally() {
            try {
                const responseApp = await fetch('https://unpkg.com');
                const codeApp = await responseApp.text();
                const scriptApp = document.createElement('script');
                scriptApp.text = codeApp;
                document.body.appendChild(scriptApp);

                const responseDb = await fetch('https://unpkg.com');
                const codeDb = await responseDb.text();
                const scriptDb = document.createElement('script');
                scriptDb.text = codeDb;
                document.body.appendChild(scriptDb);

                setTimeout(() => {
                    if (typeof firebase !== 'undefined') {
                        document.getElementById('statusMessage').innerText = "База данных успешно подключена! Нажмите Connect MetaMask.";
                        initFirebase();
                    } else {
                        document.getElementById('statusMessage').innerText = "Ошибка активации базы данных.";
                    }
                }, 500);

            } catch (err) {
                document.getElementById('statusMessage').innerText = "Браузер блокирует сеть. Пробуем резервный метод...";
                // Резервный чистый JS метод, если Fetch тоже режется защитой
                const s1 = document.createElement('script');
                s1.src = "https://gstatic.com";
                s1.onload = () => {
                    const s2 = document.createElement('script');
                    s2.src = "https://gstatic.com";
                    s2.onload = () => { initFirebase(); document.getElementById('statusMessage').innerText = "Резервное подключение успешно!"; };
                    document.body.appendChild(s2);
                };
                document.body.appendChild(s1);
            }
        }

        window.addEventListener('load', loadFirebaseLocally);

        const firebaseConfig = {
            apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
            authDomain: "://firebaseapp.com",
            projectId: "lizatest-124da",
            storageBucket: "lizatest-124da.firebasestorage.app",
            messagingSenderId: "88106031938",
            appId: "1:88106031938:web:0b3b08517e71ce33aa06db"
        };

        let database;
        let currentAccount = null;
        let userBalance = 0;
        let totalGlobalSupply = 0;

        function initFirebase() {
            firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            
            database.ref('global/totalSupply').on('value', (snapshot) => {
                totalGlobalSupply = snapshot.val() || 0;
                document.getElementById('supplyDisplay').innerText = totalGlobalSupply;
            });

            database.ref('users').on('value', (snapshot) => {
                const userList = document.getElementById('userList');
                userList.innerHTML = '';
                const users = snapshot.val();
                if(users) {
                    Object.keys(users).forEach(addr => {
                        const li = document.createElement('li');
                        li.innerText = addr.substring(0,6) + "...: " + (users[addr].balance || 0).toFixed(2);
                        userList.appendChild(li);
                    });
                }
            });
        }

        async function connectMetaMask() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    document.getElementById('statusMessage').innerText = "Открываем MetaMask...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    if (accounts && accounts.length > 0) {
                        currentAccount = accounts[0].toLowerCase();
                        
                        document.getElementById('connectWallet').innerText = currentAccount.substring(0, 6) + "...";
                        document.getElementById('lizaButton').removeAttribute('disabled');
                        document.getElementById('statusMessage').innerText = "Успешно подключено! Кликай на кнопку LIZA!";
                        
                        database.ref('users/' + currentAccount).on('value', (snapshot) => {
                            const data = snapshot.val();
                            userBalance = data ? data.balance : 0;
                            document.getElementById('balanceDisplay').innerText = userBalance.toFixed(2);
                        });
                    }
                } catch (error) {
                    alert("Ошибка MetaMask: " + error.message);
                }
            } else {
                alert("MetaMask не найден! Установите расширение кошелька.");
            }
        }

        function handleTap() {
            if (!currentAccount || !database) return;
            let reward = 50; 
            if (totalGlobalSupply + reward > 21000000) return;

            database.ref('users/' + currentAccount).set({
                balance: userBalance + reward,
                lastUpdated: firebase.database.ServerValue.TIMESTAMP
            });
            database.ref('global/totalSupply').set(totalGlobalSupply + reward);
        }
    </script>
</body>
</html>
