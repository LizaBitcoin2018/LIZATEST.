<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIZA Exchange</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #0a0a12;
        color: #eee;
        min-height: 100vh;
        padding: 16px 14px 40px;
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { color: #00c6ff; font-size: 1.5rem; }
    .user { color: #00ffcc; font-size: 0.95rem; margin-top: 3px; }

    .balance-box { text-align: center; margin-bottom: 18px; }
    .balance-box .label { color: #888; font-size: 0.9rem; margin-bottom: 3px; }
    .balances {
        display: flex;
        justify-content: center;
        gap: 24px;
        font-size: 1.25rem;
        font-weight: bold;
    }
    .liza { color: #f7931a; }
    .yo { color: #00c6ff; }

    .panel {
        background: #12121f;
        border: 1px solid #1e2a4a;
        border-radius: 16px;
        padding: 16px;
        max-width: 480px;
        margin: 0 auto;
    }
    .price {
        text-align: center;
        font-size: 1.3rem;
        font-weight: bold;
        color: #00ff88;
        margin-bottom: 2px;
    }
    .pool {
        text-align: center;
        font-size: 0.83rem;
        color: #888;
        margin-bottom: 12px;
    }

    .chart-box {
        background: #0d0d18;
        border-radius: 10px;
        height: 290px;
        margin-bottom: 14px;
        position: relative;
        overflow: hidden;
    }
    #chart { width: 100%; height: 100%; display: block; }

    .trade-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 14px;
    }
    .trade-box {
        background: #1a1a2e;
        border-radius: 10px;
        padding: 11px;
    }
    .trade-box h4 {
        font-size: 0.88rem;
        color: #aaa;
        margin-bottom: 7px;
    }
    .trade-box input {
        width: 100%;
        background: #0f0f1a;
        border: 1px solid #333;
        color: white;
        padding: 8px 10px;
        border-radius: 7px;
        font-size: 0.95rem;
        margin-bottom: 7px;
    }
    .btn-buy {
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: 7px;
        background: #00aa55;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    .btn-sell {
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: 7px;
        background: #cc3333;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .history-title {
        font-size: 0.88rem;
        color: #aaa;
        margin-bottom: 7px;
    }
    .history {
        max-height: 170px;
        overflow-y: auto;
        font-size: 0.83rem;
    }
    .trade-item {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid #222;
    }

    #auth {
        position: fixed;
        inset: 0;
        background: #0a0a12;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
    }
    .auth-box {
        background: #151525;
        border: 1px solid #00c6ff;
        border-radius: 14px;
        padding: 26px;
        width: 310px;
        text-align: center;
    }
    .auth-box h2 { color: #00c6ff; margin-bottom: 16px; }
    .auth-box input {
        width: 100%;
        background: #0f0f1a;
        border: 1px solid #333;
        color: white;
        padding: 11px;
        border-radius: 8px;
        margin-bottom: 9px;
        font-size: 1rem;
    }
    .auth-box button {
        width: 100%;
        padding: 11px;
        background: #00c6ff;
        color: #000;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
    }
    .switch {
        margin-top: 13px;
        font-size: 0.9rem;
        color: #888;
        cursor: pointer;
    }
    .switch span { color: #00aaff; }
    .err {
        color: #ff5555;
        margin-top: 11px;
        font-size: 0.9rem;
        min-height: 18px;
    }
</style>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<div id="auth">
    <div class="auth-box">
        <h2>LIZA Exchange</h2>
        <div id="loginForm">
            <input type="text" id="nick" placeholder="Никнейм" maxlength="20">
            <input type="password" id="pass" placeholder="Пароль" maxlength="30">
            <button onclick="login()">Войти</button>
            <div class="switch" onclick="showRegister()">Нет аккаунта? <span>Создать</span></div>
        </div>
        <div id="registerForm" style="display:none">
            <input type="text" id="regNick" placeholder="Никнейм" maxlength="20">
            <input type="password" id="regPass" placeholder="Пароль" maxlength="30">
            <input type="password" id="regPass2" placeholder="Повтор пароля" maxlength="30">
            <button onclick="register()">Создать</button>
            <div class="switch" onclick="showLogin()">Уже есть аккаунт? <span>Войти</span></div>
        </div>
        <div class="err" id="err"></div>
    </div>
</div>

<div id="app" style="display:none">
    <div class="header">
        <h1>LIZA Exchange</h1>
        <div class="user" id="userName">-</div>
    </div>

    <div class="balance-box">
        <div class="label">Твой баланс</div>
        <div class="balances">
            <div class="liza"><span id="balLiza">0</span> LIZA</div>
            <div class="yo"><span id="balYo">0</span> YO</div>
        </div>
    </div>

    <div class="panel">
        <div class="price">1 YO = <span id="price">1.0000</span> LIZA</div>
        <div class="pool">Пул: <span id="poolLiza">10 000 000</span> LIZA + <span id="poolYo">10 000 000</span> YO</div>

        <div class="chart-box">
            <canvas id="chart"></canvas>
        </div>

        <div class="trade-row">
            <div class="trade-box">
                <h4>Купить YO</h4>
                <input type="number" id="buyInput" placeholder="Сумма LIZA">
                <button class="btn-buy" onclick="buy()">Купить</button>
            </div>
            <div class="trade-box">
                <h4>Продать YO</h4>
                <input type="number" id="sellInput" placeholder="Сумма YO">
                <button class="btn-sell" onclick="sell()">Продать</button>
            </div>
        </div>

        <div class="history-title">Последние сделки</div>
        <div class="history" id="history"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
    authDomain: "lizatest-124da.firebaseapp.com",
    databaseURL: "https://lizatest-124da-default-rtdb.firebaseio.com",
    projectId: "lizatest-124da",
    storageBucket: "lizatest-124da.firebasestorage.app",
    messagingSenderId: "88106031938",
    appId: "1:88106031938:web:0b3b08517e71ce33aa06db"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const INITIAL_POOL = 10000000;

let nick = "";
let balLiza = 0;
let balYo = 0;
let poolLiza = INITIAL_POOL;
let poolYo = INITIAL_POOL;
let candles = [];
let trades = [];

function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
    document.getElementById('err').innerText = '';
}
function showLogin() {
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('err').innerText = '';
}

function login() {
    const n = document.getElementById('nick').value.trim().toLowerCase();
    const p = document.getElementById('pass').value;
    if (!n || !p) return document.getElementById('err').innerText = 'Заполни поля';

    db.ref('users/' + n).once('value').then(snap => {
        if (!snap.exists()) return document.getElementById('err').innerText = 'Пользователь не найден';
        if (snap.val().password !== p) return document.getElementById('err').innerText = 'Неверный пароль';
        start(n, snap.val());
    });
}

function register() {
    const n = document.getElementById('regNick').value.trim().toLowerCase();
    const p = document.getElementById('regPass').value;
    const p2 = document.getElementById('regPass2').value;

    if (n.length < 3) return document.getElementById('err').innerText = 'Ник минимум 3 символа';
    if (!/^[a-z0-9_]+$/.test(n)) return document.getElementById('err').innerText = 'Только латиница и цифры';
    if (p.length < 4) return document.getElementById('err').innerText = 'Пароль минимум 4 символа';
    if (p !== p2) return document.getElementById('err').innerText = 'Пароли не совпадают';

    db.ref('users/' + n).once('value').then(snap => {
        if (snap.exists()) return document.getElementById('err').innerText = 'Ник занят';
        const data = { password: p, balance: 100000, yoBalance: 5000 };
        db.ref('users/' + n).set(data).then(() => start(n, data));
    });
}

function start(n, data) {
    nick = n;
    balLiza = Number(data.balance) || 0;
    balYo = Number(data.yoBalance) || 0;

    document.getElementById('auth').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('userName').innerText = nick;

    // Пул
    db.ref('exchange/pool').on('value', snap => {
        const d = snap.val();
        if (d) {
            poolLiza = Number(d.liza) || INITIAL_POOL;
            poolYo = Number(d.yo) || INITIAL_POOL;
        } else {
            db.ref('exchange/pool').set({ liza: INITIAL_POOL, yo: INITIAL_POOL });
        }
        updatePrice();
    });

    // Загружаем свечи
    db.ref('exchange/candles').limitToLast(60).once('value').then(snap => {
        const val = snap.val() || {};
        candles = Object.values(val).sort((a, b) => a.t - b.t);
        draw();
    });

    // Новые свечи
    db.ref('exchange/candles').limitToLast(1).on('child_added', snap => {
        const c = snap.val();
        if (!c) return;
        if (candles.length === 0 || c.t > candles[candles.length - 1].t) {
            candles.push(c);
            if (candles.length > 60) candles.shift();
            draw();
        }
    });

    // История
    db.ref('exchange/trades').limitToLast(30).once('value').then(snap => {
        const val = snap.val() || {};
        trades = Object.values(val).sort((a, b) => b.t - a.t);
        renderHistory();
    });

    db.ref('exchange/trades').limitToLast(1).on('child_added', snap => {
        const t = snap.val();
        if (!t) return;
        if (trades.length === 0 || t.t > trades[0].t) {
            trades.unshift(t);
            if (trades.length > 30) trades.pop();
            renderHistory();
        }
    });

    updateBalance();
}

function getPrice() {
    return poolYo > 0 ? poolLiza / poolYo : 1;
}

function updatePrice() {
    document.getElementById('price').innerText = getPrice().toFixed(4);
    document.getElementById('poolLiza').innerText = Math.floor(poolLiza).toLocaleString('ru');
    document.getElementById('poolYo').innerText = Math.floor(poolYo).toLocaleString('ru');
}

function updateBalance() {
    document.getElementById('balLiza').innerText = Math.floor(balLiza).toLocaleString('ru');
    document.getElementById('balYo').innerText = balYo.toLocaleString('ru', {maximumFractionDigits: 4});
}

function buy() {
    const amount = parseFloat(document.getElementById('buyInput').value);
    if (!amount || amount <= 0) return;
    if (amount > balLiza) return alert('Недостаточно LIZA');

    const k = poolLiza * poolYo;
    const newLiza = poolLiza + amount;
    const newYo = k / newLiza;
    const got = poolYo - newYo;

    balLiza -= amount;
    balYo += got;
    poolLiza = newLiza;
    poolYo = newYo;

    const price = getPrice();
    const now = Date.now();

    // Берём закрытие предыдущей свечи
    let prevClose = price;
    if (candles.length > 0) {
        prevClose = candles[candles.length - 1].c;
    }

    const candle = {
        o: prevClose,
        h: Math.max(prevClose, price) * 1.002,
        l: Math.min(prevClose, price) * 0.998,
        c: price,
        v: amount,
        t: now
    };

    const trade = {
        type: 'buy',
        amount: +got.toFixed(4),
        price: +price.toFixed(6),
        user: nick,
        t: now
    };

    candles.push(candle);
    if (candles.length > 60) candles.shift();
    trades.unshift(trade);
    if (trades.length > 30) trades.pop();

    draw();
    renderHistory();
    updateBalance();
    updatePrice();

    db.ref('users/' + nick).update({ balance: balLiza, yoBalance: balYo });
    db.ref('exchange/pool').set({ liza: poolLiza, yo: poolYo });
    db.ref('exchange/candles').push(candle);
    db.ref('exchange/trades').push(trade);

    document.getElementById('buyInput').value = '';
}

function sell() {
    const amount = parseFloat(document.getElementById('sellInput').value);
    if (!amount || amount <= 0) return;
    if (amount > balYo) return alert('Недостаточно YO');

    const k = poolLiza * poolYo;
    const newYo = poolYo + amount;
    const newLiza = k / newYo;
    const got = poolLiza - newLiza;

    balYo -= amount;
    balLiza += got;
    poolYo = newYo;
    poolLiza = newLiza;

    const price = getPrice();
    const now = Date.now();

    let prevClose = price;
    if (candles.length > 0) {
        prevClose = candles[candles.length - 1].c;
    }

    const candle = {
        o: prevClose,
        h: Math.max(prevClose, price) * 1.002,
        l: Math.min(prevClose, price) * 0.998,
        c: price,
        v: got,
        t: now
    };

    const trade = {
        type: 'sell',
        amount: +amount.toFixed(4),
        price: +price.toFixed(6),
        user: nick,
        t: now
    };

    candles.push(candle);
    if (candles.length > 60) candles.shift();
    trades.unshift(trade);
    if (trades.length > 30) trades.pop();

    draw();
    renderHistory();
    updateBalance();
    updatePrice();

    db.ref('users/' + nick).update({ balance: balLiza, yoBalance: balYo });
    db.ref('exchange/pool').set({ liza: poolLiza, yo: poolYo });
    db.ref('exchange/candles').push(candle);
    db.ref('exchange/trades').push(trade);

    document.getElementById('sellInput').value = '';
}

function renderHistory() {
    const box = document.getElementById('history');
    if (!trades.length) {
        box.innerHTML = '<div style="color:#666;text-align:center;padding:12px">Пока нет сделок</div>';
        return;
    }
    box.innerHTML = trades.map(t => `
        <div class="trade-item">
            <span style="color:${t.type==='buy'?'#00ff88':'#ff5555'}">${t.type==='buy'?'BUY':'SELL'} ${Number(t.amount).toFixed(2)}</span>
            <span>${Number(t.price).toFixed(4)}</span>
            <span style="color:#888">${t.user}</span>
        </div>
    `).join('');
}

function draw() {
    const canvas = document.getElementById('chart');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;
    if (w < 50 || h < 50) return;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Фон
    ctx.fillStyle = '#0d0d18';
    ctx.fillRect(0, 0, w, h);

    if (candles.length === 0) {
        ctx.fillStyle = '#555';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Сделайте первую сделку', w/2, h/2);
        return;
    }

    const data = candles.slice(-45);
    const chartH = h * 0.65;
    const volH = h * 0.28;

    let minP = Math.min(...data.map(c => c.l));
    let maxP = Math.max(...data.map(c => c.h));

    if (maxP - minP < 0.008) {
        const mid = (maxP + minP) / 2;
        minP = mid - 0.015;
        maxP = mid + 0.015;
    }

    const pad = (maxP - minP) * 0.18;
    minP -= pad;
    maxP += pad;
    const range = maxP - minP;
    const maxV = Math.max(...data.map(c => c.v)) || 1;

    // Сетка
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';

    for (let i = 0; i <= 4; i++) {
        const y = 16 + (i / 4) * (chartH - 14);
        const p = maxP - (i / 4) * range;
        ctx.beginPath();
        ctx.moveTo(50, y);
        ctx.lineTo(w - 8, y);
        ctx.stroke();
        ctx.fillText(p.toFixed(4), 4, y + 3);
    }

    const cw = Math.max(6, (w - 70) / data.length - 2.5);

    data.forEach((c, i) => {
        const x = 55 + i * (cw + 2.5);

        const yH = 16 + ((maxP - c.h) / range) * (chartH - 14);
        const yL = 16 + ((maxP - c.l) / range) * (chartH - 14);
        const yO = 16 + ((maxP - c.o) / range) * (chartH - 14);
        const yC = 16 + ((maxP - c.c) / range) * (chartH - 14);

        const up = c.c >= c.o;
        const col = up ? '#00c853' : '#ff1744';

        // Фитиль
        ctx.beginPath();
        ctx.strokeStyle = col;
        ctx.lineWidth = 2;
        ctx.moveTo(x + cw / 2, yH);
        ctx.lineTo(x + cw / 2, yL);
        ctx.stroke();

        // Тело
        let top = Math.min(yO, yC);
        let height = Math.abs(yC - yO);
        if (height < 5) height = 5;

        ctx.fillStyle = col;
        ctx.fillRect(x, top, cw, height);
    });

    // Объём
    data.forEach((c, i) => {
        const x = 55 + i * (cw + 2.5);
        const up = c.c >= c.o;
        const vh = Math.max(3, (c.v / maxV) * (volH - 8));
        ctx.fillStyle = up ? 'rgba(0,200,83,0.45)' : 'rgba(255,23,68,0.45)';
        ctx.fillRect(x, h - 6 - vh, cw, vh);
    });

    // Последняя цена
    const last = data[data.length - 1].c;
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(last.toFixed(4), w - 10, 16);
}

window.addEventListener('resize', () => setTimeout(draw, 100));
</script>
</body>
</html>
