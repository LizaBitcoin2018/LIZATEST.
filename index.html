<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIZA Exchange</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: #eee;
        }
        body {
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #galaxy {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center, #0a0a2a 0%, #000 70%);
            overflow: hidden;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .galaxy-arm {
            position: absolute;
            top: 50%; left: 50%;
            width: 140vmax; height: 140vmax;
            margin: -70vmax;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(100,80,255,0.08) 40deg, rgba(180,100,255,0.15) 80deg, transparent 120deg, rgba(80,150,255,0.1) 180deg, transparent 220deg, rgba(150,80,255,0.12) 280deg, transparent 360deg);
            border-radius: 50%;
            animation: rotateGalaxy 120s linear infinite;
            filter: blur(40px);
        }
        @keyframes rotateGalaxy {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(15,15,25,0.92);
            border-bottom: 2px solid #00c6ff;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #00c6ff; font-size: 1.35rem; }
        .user-info { color: #00ffcc; font-size: 0.95rem; }

        .content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 50px;
            max-width: 520px;
            margin: 0 auto;
            width: 100%;
        }

        .balance-block {
            text-align: center;
            margin-bottom: 22px;
            width: 100%;
        }
        .balance-label { color: #aaa; font-size: 0.95rem; margin-bottom: 4px; }
        .balances {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.4rem;
            font-weight: bold;
        }
        .bal-liza { color: #f7931a; }
        .bal-yo { color: #00c6ff; }

        .exchange-panel {
            background: rgba(15,20,40,0.95);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            border: 1px solid rgba(0,180,255,0.35);
        }
        .exchange-panel h3 {
            color: #00c6ff;
            text-align: center;
            margin-bottom: 14px;
            font-size: 1.25rem;
        }
        .price-line {
            text-align: center;
            font-size: 1.45rem;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 6px;
        }
        .liquidity-info {
            text-align: center;
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 16px;
        }

        .chart-container {
            background: #0a0a15;
            border-radius: 10px;
            height: 190px;
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
        }
        #priceChart {
            width: 100%;
            height: 100%;
            display: block;
        }

        .trade-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        .trade-box {
            background: rgba(0,0,0,0.35);
            border-radius: 12px;
            padding: 14px;
        }
        .trade-box h4 {
            font-size: 0.92rem;
            margin-bottom: 10px;
            color: #ccc;
        }
        .trade-box input {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid #444;
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .buy-btn, .sell-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            color: white;
        }
        .buy-btn { background: #00aa55; }
        .sell-btn { background: #cc3333; }
        .buy-btn:hover { background: #00cc66; }
        .sell-btn:hover { background: #ee4444; }

        .orderbook {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.82rem;
            margin-bottom: 16px;
        }
        .orderbook-side h5 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }
        .asks h5 { color: #ff5555; }
        .bids h5 { color: #00ff88; }
        .ob-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 4px;
        }

        .recent-title {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        .recent-trades {
            max-height: 160px;
            overflow-y: auto;
            font-size: 0.84rem;
        }
        .trade-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #222;
        }

        #authBlock {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.96);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .auth-box {
            background: rgba(20,20,40,0.98);
            border: 1px solid #00c6ff;
            border-radius: 16px;
            padding: 30px;
            width: 340px;
            max-width: 92vw;
            text-align: center;
        }
        .auth-box h1 {
            color: #00c6ff;
            font-size: 1.7rem;
            margin-bottom: 22px;
        }
        .auth-box input {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid #555;
            color: white;
            padding: 13px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 1rem;
            outline: none;
        }
        .auth-box input:focus { border-color: #00c6ff; }
        .auth-btn {
            width: 100%;
            background: #00c6ff;
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            margin-top: 4px;
        }
        .auth-switch {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #aaa;
            cursor: pointer;
        }
        .auth-switch span { color: #00aaff; text-decoration: underline; }
        .error {
            color: #ff5555;
            margin-top: 14px;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="galaxy">
        <div class="galaxy-arm"></div>
    </div>

    <div id="authBlock">
        <div class="auth-box">
            <h1>LIZA Exchange</h1>
            <div id="loginForm">
                <input type="text" id="nickInput" placeholder="Никнейм" maxlength="20">
                <input type="password" id="passInput" placeholder="Пароль" maxlength="30">
                <button type="button" class="auth-btn" id="loginBtn">Войти</button>
                <div class="auth-switch" id="toRegister">Нет аккаунта? <span>Зарегистрироваться</span></div>
            </div>
            <div id="registerForm" style="display:none;">
                <input type="text" id="regNick" placeholder="Никнейм" maxlength="20">
                <input type="password" id="regPass" placeholder="Пароль" maxlength="30">
                <input type="password" id="regPass2" placeholder="Повторите пароль" maxlength="30">
                <button type="button" class="auth-btn" id="registerBtn">Создать аккаунт</button>
                <div class="auth-switch" id="toLogin">Уже есть аккаунт? <span>Войти</span></div>
            </div>
            <p id="errorText" class="error"></p>
        </div>
    </div>

    <div class="header" id="header" style="display:none;">
        <h1>LIZA Exchange</h1>
        <div class="user-info" id="userDisplay">-</div>
    </div>

    <div class="content" id="game" style="display:none;">
        <div class="balance-block">
            <div class="balance-label">Твой баланс</div>
            <div class="balances">
                <div class="bal-liza"><span id="balanceDisplay">0</span> LIZA</div>
                <div class="bal-yo"><span id="yoBalanceDisplay">0</span> YO</div>
            </div>
        </div>

        <div class="exchange-panel">
            <h3>Биржа LIZA / YO</h3>
            
            <div class="price-line">
                1 YO = <span id="currentPrice">1.0000</span> LIZA
            </div>
            <div class="liquidity-info">
                Пул: <span id="poolLiza">1 000 000</span> LIZA + <span id="poolYo">1 000 000</span> YO
            </div>

            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>

            <div class="trade-form">
                <div class="trade-box">
                    <h4>Купить YO за LIZA</h4>
                    <input type="number" id="buyAmount" placeholder="Сумма LIZA" min="1" step="any">
                    <button class="buy-btn" id="buyBtn">Купить YO</button>
                </div>
                <div class="trade-box">
                    <h4>Продать YO за LIZA</h4>
                    <input type="number" id="sellAmount" placeholder="Сумма YO" min="0.01" step="any">
                    <button class="sell-btn" id="sellBtn">Продать YO</button>
                </div>
            </div>

            <div class="orderbook">
                <div class="orderbook-side asks">
                    <h5>Продажа</h5>
                    <div id="asksList"></div>
                </div>
                <div class="orderbook-side bids">
                    <h5>Покупка</h5>
                    <div id="bidsList"></div>
                </div>
            </div>

            <div class="recent-title">Последние сделки</div>
            <div class="recent-trades" id="recentTrades"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
            authDomain: "lizatest-124da.firebaseapp.com",
            databaseURL: "https://lizatest-124da-default-rtdb.firebaseio.com",
            projectId: "lizatest-124da",
            storageBucket: "lizatest-124da.firebasestorage.app",
            messagingSenderId: "88106031938",
            appId: "1:88106031938:web:0b3b08517e71ce33aa06db"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const INITIAL_LIZA = 1000000;
        const INITIAL_YO = 1000000;

        let myNick = "";
        let myBalance = 0;
        let myYoBalance = 0;
        let poolLiza = INITIAL_LIZA;
        let poolYo = INITIAL_YO;
        let priceHistory = [];
        let recentTrades = [];

        // Звёзды
        const galaxy = document.getElementById('galaxy');
        for (let i = 0; i < 90; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.2 + 0.4;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
            star.style.animationDelay = (Math.random() * 5) + 's';
            galaxy.appendChild(star);
        }

        // Авторизация
        const errorText = document.getElementById('errorText');

        document.getElementById('toRegister').onclick = () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            errorText.innerText = '';
        };
        document.getElementById('toLogin').onclick = () => {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            errorText.innerText = '';
        };

        document.getElementById('loginBtn').onclick = doLogin;
        document.getElementById('passInput').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
        document.getElementById('registerBtn').onclick = doRegister;
        document.getElementById('regPass2').onkeydown = e => { if (e.key === 'Enter') doRegister(); };

        function doLogin() {
            const nick = document.getElementById('nickInput').value.trim().toLowerCase();
            const pass = document.getElementById('passInput').value;
            if (!nick || !pass) return errorText.innerText = "Заполни все поля";

            errorText.innerText = "Проверяем...";
            db.ref('users/' + nick).once('value').then(snap => {
                if (!snap.exists()) return errorText.innerText = "Пользователь не найден";
                const data = snap.val();
                if (data.password !== pass) return errorText.innerText = "Неверный пароль";
                startGame(nick, data);
            }).catch(() => errorText.innerText = "Ошибка соединения");
        }

        function doRegister() {
            const nick = document.getElementById('regNick').value.trim().toLowerCase();
            const pass = document.getElementById('regPass').value;
            const pass2 = document.getElementById('regPass2').value;

            if (!nick || nick.length < 3) return errorText.innerText = "Ник минимум 3 символа";
            if (!/^[a-z0-9_]+$/.test(nick)) return errorText.innerText = "Только латиница, цифры и _";
            if (!pass || pass.length < 4) return errorText.innerText = "Пароль минимум 4 символа";
            if (pass !== pass2) return errorText.innerText = "Пароли не совпадают";

            errorText.innerText = "Создаём аккаунт...";
            db.ref('users/' + nick).once('value').then(snap => {
                if (snap.exists()) return errorText.innerText = "Такой ник уже занят";

                const data = {
                    password: pass,
                    balance: 50000,
                    yoBalance: 1000
                };
                return db.ref('users/' + nick).set(data).then(() => startGame(nick, data));
            }).catch(err => errorText.innerText = "Ошибка: " + (err.message || "неизвестно"));
        }

        function startGame(nick, data) {
            myNick = nick;
            myBalance = Number(data.balance) || 0;
            myYoBalance = Number(data.yoBalance) || 0;

            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('header').style.display = 'flex';
            document.getElementById('game').style.display = 'flex';
            document.getElementById('userDisplay').innerText = myNick;

            // Пул
            db.ref('exchange/pool').on('value', snap => {
                const d = snap.val();
                if (!d) {
                    db.ref('exchange/pool').set({ liza: INITIAL_LIZA, yo: INITIAL_YO });
                    poolLiza = INITIAL_LIZA;
                    poolYo = INITIAL_YO;
                } else {
                    poolLiza = Number(d.liza) || INITIAL_LIZA;
                    poolYo = Number(d.yo) || INITIAL_YO;
                }
                updateExchangeUI();
            });

            // История цен
            db.ref('exchange/priceHistory').limitToLast(100).on('value', snap => {
                const val = snap.val() || {};
                priceHistory = Object.values(val).sort((a, b) => a.t - b.t);
                drawChart();
            });

            // Сделки
            db.ref('exchange/trades').limitToLast(30).on('value', snap => {
                const val = snap.val() || {};
                recentTrades = Object.values(val).sort((a, b) => b.t - a.t);
                renderRecentTrades();
            });

            updateUI();
            document.getElementById('buyBtn').onclick = buyYO;
            document.getElementById('sellBtn').onclick = sellYO;
        }

        function getPrice() {
            if (poolYo <= 0) return 1;
            return poolLiza / poolYo;
        }

        function updateExchangeUI() {
            const price = getPrice();
            document.getElementById('currentPrice').innerText = price.toFixed(4);
            document.getElementById('poolLiza').innerText = Math.floor(poolLiza).toLocaleString('ru');
            document.getElementById('poolYo').innerText = Math.floor(poolYo).toLocaleString('ru');
            renderOrderBook(price);
        }

        function renderOrderBook(price) {
            const asks = [], bids = [];
            for (let i = 1; i <= 6; i++) {
                asks.push({ price: price * (1 + i * 0.008), amount: Math.floor(1200 + Math.random() * 8000) });
                bids.push({ price: price * (1 - i * 0.008), amount: Math.floor(1200 + Math.random() * 8000) });
            }
            document.getElementById('asksList').innerHTML = asks.map(a => `
                <div class="ob-row">
                    <span style="color:#ff6666">${a.price.toFixed(4)}</span>
                    <span>${a.amount.toLocaleString('ru')}</span>
                </div>
            `).join('');
            document.getElementById('bidsList').innerHTML = bids.map(b => `
                <div class="ob-row">
                    <span style="color:#66ff99">${b.price.toFixed(4)}</span>
                    <span>${b.amount.toLocaleString('ru')}</span>
                </div>
            `).join('');
        }

        // ===== ГЛАВНОЕ ИСПРАВЛЕНИЕ ГРАФИКА =====
        function addPricePoint(price) {
            const point = { p: price, t: Date.now() };
            
            // Сразу добавляем локально
            priceHistory.push(point);
            if (priceHistory.length > 100) priceHistory.shift();
            
            // Сразу рисуем
            drawChart();

            // И отправляем в Firebase
            db.ref('exchange/priceHistory').push(point);
        }

        function buyYO() {
            if (!myNick) return;

            const lizaIn = parseFloat(document.getElementById('buyAmount').value);
            if (isNaN(lizaIn) || lizaIn <= 0) return alert("Введите сумму LIZA");
            if (lizaIn > myBalance) return alert("Недостаточно LIZA");

            const k = poolLiza * poolYo;
            const newPoolLiza = poolLiza + lizaIn;
            const newPoolYo = k / newPoolLiza;
            const yoOut = poolYo - newPoolYo;

            if (yoOut <= 0.0001) return alert("Слишком маленькая сумма");

            myBalance -= lizaIn;
            myYoBalance += yoOut;
            poolLiza = newPoolLiza;
            poolYo = newPoolYo;

            const price = getPrice();

            // Обновляем данные
            db.ref('users/' + myNick).update({ balance: myBalance, yoBalance: myYoBalance });
            db.ref('exchange/pool').set({ liza: poolLiza, yo: poolYo });
            db.ref('exchange/trades').push({
                type: 'buy',
                amount: yoOut,
                price: price,
                user: myNick,
                t: Date.now()
            });

            // Вот здесь сразу обновляем график
            addPricePoint(price);

            updateUI();
            updateExchangeUI();
            document.getElementById('buyAmount').value = '';
            alert(`Куплено ${yoOut.toFixed(4)} YO\nза ${lizaIn.toLocaleString('ru')} LIZA`);
        }

        function sellYO() {
            if (!myNick) return;

            const yoIn = parseFloat(document.getElementById('sellAmount').value);
            if (isNaN(yoIn) || yoIn <= 0) return alert("Введите сумму YO");
            if (yoIn > myYoBalance) return alert("Недостаточно YO");

            const k = poolLiza * poolYo;
            const newPoolYo = poolYo + yoIn;
            const newPoolLiza = k / newPoolYo;
            const lizaOut = poolLiza - newPoolLiza;

            if (lizaOut <= 0.0001) return alert("Слишком маленькая сумма");

            myYoBalance -= yoIn;
            myBalance += lizaOut;
            poolYo = newPoolYo;
            poolLiza = newPoolLiza;

            const price = getPrice();

            db.ref('users/' + myNick).update({ balance: myBalance, yoBalance: myYoBalance });
            db.ref('exchange/pool').set({ liza: poolLiza, yo: poolYo });
            db.ref('exchange/trades').push({
                type: 'sell',
                amount: yoIn,
                price: price,
                user: myNick,
                t: Date.now()
            });

            // Сразу обновляем график
            addPricePoint(price);

            updateUI();
            updateExchangeUI();
            document.getElementById('sellAmount').value = '';
            alert(`Продано ${yoIn.toFixed(4)} YO\nполучено ${lizaOut.toFixed(2)} LIZA`);
        }

        function renderRecentTrades() {
            const box = document.getElementById('recentTrades');
            if (!recentTrades.length) {
                box.innerHTML = '<div style="color:#666;text-align:center;padding:12px;">Пока нет сделок</div>';
                return;
            }
            box.innerHTML = recentTrades.map(t => `
                <div class="trade-item">
                    <span style="color:${t.type === 'buy' ? '#00ff88' : '#ff5555'}">
                        ${t.type === 'buy' ? 'BUY' : 'SELL'} ${Number(t.amount).toFixed(3)}
                    </span>
                    <span>${Number(t.price).toFixed(4)}</span>
                    <span style="color:#888">${t.user}</span>
                </div>
            `).join('');
        }

        function drawChart() {
            const canvas = document.getElementById('priceChart');
            if (!canvas) return;

            const parent = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            const w = parent.clientWidth;
            const h = parent.clientHeight;

            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';

            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            // Фон
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, w, h);

            if (priceHistory.length < 2) {
                ctx.fillStyle = '#666';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Сделайте первую сделку', w / 2, h / 2);
                return;
            }

            const prices = priceHistory.map(p => p.p);
            let minP = Math.min(...prices);
            let maxP = Math.max(...prices);
            
            // Чтобы линия не была совсем плоской
            if (maxP - minP < 0.0001) {
                minP -= 0.001;
                maxP += 0.001;
            }

            const range = maxP - minP;

            // Рисуем линию
            ctx.beginPath();
            ctx.strokeStyle = '#00c6ff';
            ctx.lineWidth = 2.8;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';

            priceHistory.forEach((p, i) => {
                const x = (i / (priceHistory.length - 1)) * (w - 20) + 10;
                const y = h - 15 - ((p.p - minP) / range) * (h - 30);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Точка последней цены
            const lastX = w - 10;
            const lastY = h - 15 - ((prices[prices.length - 1] - minP) / range) * (h - 30);
            ctx.beginPath();
            ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#00ff88';
            ctx.fill();

            // Текст последней цены
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(prices[prices.length - 1].toFixed(4), w - 12, 20);
        }

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = myBalance.toLocaleString('ru');
            document.getElementById('yoBalanceDisplay').innerText = myYoBalance.toLocaleString('ru', {maximumFractionDigits: 4});
        }
    </script>
</body>
</html>
