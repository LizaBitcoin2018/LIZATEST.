<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIZABITCOIN - SECURE TEXT INPUT</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent-color: #f7931a; --sidebar-bg: #252525; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background-color: var(--sidebar-bg); border-right: 2px solid var(--accent-color); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .sidebar h2 { color: var(--accent-color); margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 1.2rem; }
        .user-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .user-item { padding: 10px; border-bottom: 1px solid #333; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; }
        .header-actions { position: absolute; top: 20px; right: 20px; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        #lizaButton { width: 200px; height: 200px; border-radius: 50%; font-size: 2rem; box-shadow: 0 0 20px rgba(247, 147, 26, 0.4); margin-top: 10px; }
        #lizaButton:disabled { background-color: #555; cursor: not-allowed; box-shadow: none; }
        .info-text { margin-top: 20px; color: #00ffcc; text-align: center; max-width: 400px; font-weight: bold; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: var(--sidebar-bg); border: 2px solid var(--accent-color); padding: 30px; border-radius: 12px; text-align: center; max-width: 400px; width: 90%; }
        .modal-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 1rem; box-sizing: border-box; text-align: center; }
        .logout-btn { background-color: #444; border: 1px solid #555; font-size: 0.85rem; padding: 8px 16px; }
    </style>
</head>
<body>

    <!-- Окно авторизации -->
    <div id="authModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>LIZABITCOIN</h3>
            <p style="color: #bbb; font-size: 0.9rem;">Введите ваш никнейм или текстовый адрес для входа в игру</p>
            <input type="text" id="usernameInput" placeholder="Например: LizaBitcoin" maxlength="20">
            <button id="loginBtn">Войти в игру</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="sidebar">
        <h2>Wallets Dashboard</h2>
        <ul id="userList" class="user-list">
            <li class="user-item">Синхронизация базы данных...</li>
        </ul>
    </div>

    <!-- Main Game Area -->
    <div class="main-content">
        <div class="header-actions">
            <button id="logoutBtn" class="logout-btn">Сменить аккаунт</button>
        </div>

        <div style="text-align: center; margin-bottom: 30px;">
            <div style="font-size: 1.2rem; color: #888;">USER: <span id="currentUserNameDisplay" style="color: #fff;">-</span></div>
            <div id="balanceDisplay" style="font-size: 3rem; font-weight: bold; margin: 10px 0; color: var(--accent-color);">0.00</div>
            <div style="color: #aaa;">Reward per click: <span id="rewardDisplay">50</span> LIZA</div>
            <div style="font-size: 0.9rem; color: #666; margin-top: 5px;">Total Supply: <span id="supplyDisplay">0</span> / 21,000,000</div>
        </div>

        <button id="lizaButton" disabled>LIZA</button>
        <div id="statusMessage" class="info-text">Инициализация модулей...</div>
    </div>

    <script>
        // Твой прямой URL базы данных без дефиса перед default
        const DB_URL = "https://firebaseio.com";

        let currentAccount = null;
        let userBalance = 0;
        let totalGlobalSupply = 0;
        const MAX_SUPPLY = 21000000;

        function calculateReward(supply) {
            let baseReward = 50;
            const halvingEra = Math.floor(supply / 5250000);
            let currentReward = baseReward / Math.pow(2, halvingEra);
            return currentReward > 0 ? currentReward : 0;
        }

        function formatDisplayName(name) {
            if (name.startsWith('0x') && name.length >= 12) {
                return name.substring(0, 6) + "..." + name.substring(name.length - 4);
            }
            return name;
        }

        // Обновление всей информации через чистый REST API Fetch (не блокируется!)
        async function updateDataFromServer() {
            try {
                const res = await fetch(`${DB_URL}.json`);
                if (!res.ok) throw new Error("Network error");
                const data = await res.json();
                
                // 1. Считываем глобальный саплай
                totalGlobalSupply = (data && data.global) ? data.global.totalSupply : 0;
                document.getElementById('supplyDisplay').innerText = totalGlobalSupply.toLocaleString();
                document.getElementById('rewardDisplay').innerText = calculateReward(totalGlobalSupply);

                // 2. Считываем баланс игрока
                if (currentAccount && data && data.users && data.users[currentAccount]) {
                    userBalance = data.users[currentAccount].balance || 0;
                    document.getElementById('balanceDisplay').innerText = userBalance.toFixed(2);
                }

                // 3. Обновляем дашборд участников
                const userList = document.getElementById('userList');
                userList.innerHTML = '';
                if (data && data.users) {
                    Object.keys(data.users).forEach(addr => {
                        const bal = data.users[addr].balance || 0;
                        const li = document.createElement('li');
                        li.className = 'user-item';
                        li.innerHTML = `<span style="font-family:monospace;color:#aaa;">${formatDisplayName(addr)}</span><strong style="color:#f7931a;">${bal.toFixed(2)}</strong>`;
                        userList.appendChild(li);
                    });
                } else {
                    userList.innerHTML = '<li class="user-item" style="color: #888;">Нет активных майнеров</li>';
                }
            } catch (err) {
                console.error("Ошибка синхронизации данных:", err);
            }
        }

        function initUserSession(username) {
            currentAccount = username;
            document.getElementById('authModal').style.display = 'none';
            document.getElementById('currentUserNameDisplay').innerText = formatDisplayName(currentAccount);
            document.getElementById('lizaButton').removeAttribute('disabled');
            document.getElementById('statusMessage').innerText = "Вы успешно вошли! Кликайте по кнопке LIZA!";
            updateDataFromServer();
        }

        function loginWithText() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) {
                alert("Пожалуйста, введите никнейм!");
                return;
            }
            const safeName = input.replace(/[\.\$\#\[\]\/]/g, "_");
            localStorage.setItem('lizabitcoin_user', safeName);
            initUserSession(safeName);
        }

        function logout() {
            localStorage.removeItem('lizabitcoin_user');
            currentAccount = null;
            document.getElementById('lizaButton').setAttribute('disabled', 'true');
            document.getElementById('balanceDisplay').innerText = "0.00";
            document.getElementById('currentUserNameDisplay').innerText = "-";
            document.getElementById('statusMessage').innerText = "Пожалуйста, авторизуйтесь.";
            document.getElementById('usernameInput').value = "";
            document.getElementById('authModal').style.display = 'flex';
        }

        // Клик по кнопке LIZA отправляется PATCH пакетом прямо в JSON базы данных
        async function handleTap() {
            if (!currentAccount) return;

            const reward = calculateReward(totalGlobalSupply);
            if (totalGlobalSupply + reward > MAX_SUPPLY) {
                document.getElementById('statusMessage').innerText = "Лимит эмиссии в 21 000 000 LIZA исчерпан!";
                return;
            }

            const nextUserBalance = userBalance + reward;
            const nextGlobalSupply = totalGlobalSupply + reward;

            // Мгновенный локальный апдейт на экране для плавности
            userBalance = nextUserBalance;
            totalGlobalSupply = nextGlobalSupply;
            document.getElementById('balanceDisplay').innerText = userBalance.toFixed(2);
            document.getElementById('supplyDisplay').innerText = totalGlobalSupply.toLocaleString();

            try {
                await fetch(`${DB_URL}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        [`users/${currentAccount}/balance`]: nextUserBalance,
                        [`global/totalSupply`]: nextGlobalSupply
                    })
                });
            } catch (err) {
                console.error("Ошибка сохранения клика:", err);
            }
        }

        // Привязка слушателей
