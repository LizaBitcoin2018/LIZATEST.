<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Exchange AI Emulator 2026</title>
    <style>
        :root {
            --text-green: #00e676;
            --text-red: #ff5252;
            --bg-main: #0d0613;
            --bg-panel: #171b26;
            --bg-grid: #1e222d;
            --primary: #33d7bf;
            --text-muted: #848e9c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
            padding: 10px;
            gap: 10px;
        }

        .orderbook-panel {
            width: 280px;
            background-color: var(--bg-panel);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border: 1px solid #222;
        }

        .panel-title {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: var(--primary);
            text-align: center;
        }

        .ob-header, .ob-row {
            display: flex;
            justify-content: space-between;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            padding: 4px 5px;
            position: relative;
        }

        .ob-header {
            color: var(--text-muted);
            border-bottom: 1px solid #2a2e39;
            margin-bottom: 5px;
        }

        .ob-rows {
            flex: 1;
            display: flex;
            flex-direction: column-reverse;
            overflow: hidden;
        }

        .ob-rows.bids {
            flex: 1;
            flex-direction: column;
        }

        .ob-row .depth-bg {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 1;
            pointer-events: none;
        }

        .ob-row span {
            position: relative;
            z-index: 2;
        }

        .price-current-box {
            background-color: var(--bg-grid);
            padding: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 8px 0;
            border-radius: 4px;
            font-family: 'Consolas', monospace;
        }

        .chart-panel {
            flex: 1;
            background-color: var(--bg-panel);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border: 1px solid #222;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            width: 100%;
        }

        canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        .trade-panel {
            width: 280px;
            background-color: var(--bg-panel);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border: 1px solid #222;
            gap: 15px;
        }

        .trade-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
        }

        .btn-buy { background-color: var(--text-green); }
        .btn-sell { background-color: var(--text-red); }

        .history-box {
            flex: 1;
            background-color: var(--bg-main);
            border-radius: 4px;
            padding: 5px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 12px;
            border: 1px solid #2a2e39;
        }

        .history-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 5px;
        }
    </style>
</head>
<body>

    <div class="orderbook-panel">
        <div class="panel-title">Ордербук LIZA/USDT</div>
        <div class="ob-header">
            <span>Цена (USDT)</span>
            <span>Объем</span>
        </div>
        <div class="ob-rows" id="asks-container"></div>
        <div class="price-current-box" id="current-price-display">100.00</div>
        <div class="ob-rows bids" id="bids-container"></div>
    </div>

    <div class="chart-panel">
        <div class="panel-title" style="text-align: left; padding-left: 10px;">График цен и объемов (5s)</div>
        <div class="canvas-container">
            <canvas id="exchangeChart"></canvas>
        </div>
    </div>

    <div class="trade-panel">
        <div class="panel-title">Торговый терминал</div>
        <div class="trade-buttons">
            <button class="btn btn-buy" id="player-buy-btn">BUY (Рыночный памп)</button>
            <button class="btn btn-sell" id="player-sell-btn">SELL (Рыночный дамп)</button>
        </div>
        <div class="panel-title" style="margin-bottom: 0;">Лента сделок</div>
        <div class="history-box" id="history-container"></div>
    </div>

    <script>
        window.onload = function() {
            let currentPrice = 100.00;
            let tradeHistory = [];
            let candles = [];
            
            function createNewCandle(price) {
                return { open: price, high: price, low: price, close: price, volume: 0 };
            }
            
            let currentCandle = createNewCandle(currentPrice);

            const canvas = document.getElementById('exchangeChart');
            const ctx = canvas.getContext('2d');

            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function simulateMarket() {
                const change = (Math.random() - 0.5) * 0.16;
                currentPrice = Math.max(0.01, parseFloat((currentPrice + change).toFixed(2)));

                currentCandle.close = currentPrice;
                if (currentPrice > currentCandle.high) currentCandle.high = currentPrice;
                if (currentPrice < currentCandle.low) currentCandle.low = currentPrice;
                
                const tradeVol = Math.floor(Math.random() * 250) + 10;
                currentCandle.volume += tradeVol;

                const side = change >= 0 ? 'BUY' : 'SELL';
                addTradeHistory(side, currentPrice, tradeVol);
                renderOrderBook();
                
                setTimeout(simulateMarket, Math.floor(Math.random() * 200) + 150);
            }

            function playerOrder(side) {
                const multiplier = side === 'BUY' ? 1.003 : 0.997;
                currentPrice = parseFloat((currentPrice * multiplier).toFixed(2));
                
                currentCandle.close = currentPrice;
                if (currentPrice > currentCandle.high) currentCandle.high = currentPrice;
                if (currentPrice < currentCandle.low) currentCandle.low = currentPrice;
                
                const pVol = 1500;
                currentCandle.volume += pVol;
                
                addTradeHistory(side, currentPrice, pVol);
                renderOrderBook();
            }

            document.getElementById('player-buy-btn').onclick = () => playerOrder('BUY');
            document.getElementById('player-sell-btn').onclick = () => playerOrder('SELL');

            function addTradeHistory(side, price, vol) {
                const timeStr = new Date().toLocaleTimeString();
                tradeHistory.unshift({ side, price, vol, time: timeStr });
                if (tradeHistory.length > 30) tradeHistory.pop();
                
                const container = document.getElementById('history-container');
                container.innerHTML = tradeHistory.map(t => `
                    <div class="history-row" style="color: ${t.side === 'BUY' ? 'var(--text-green)' : 'var(--text-red)'}">
                        <span>${t.time}</span>
                        <span>${t.price.toFixed(2)}</span>
                        <span style="color: #fff">${t.vol}</span>
                    </div>
                `).join('');
            }

            function renderOrderBook() {
                const displayPrice = document.getElementById('current-price-display');
                displayPrice.innerText = currentPrice.toFixed(2);
                
                if(tradeHistory.length > 0) {
                    displayPrice.style.color = tradeHistory[0].side === 'BUY' ? 'var(--text-green)' : 'var(--text-red)';
                }

                const asksContainer = document.getElementById('asks-container');
                const bidsContainer = document.getElementById('bids-container');

                let asksHtml = '';
                let bidsHtml = '';
                let maxVol = 1;
                const generatedAsks = [];
                const generatedBids = [];

                for (let i = 1; i <= 7; i++) {
                    const askPrice = parseFloat((currentPrice + (i * (Math.random() * 0.04 + 0.01))).toFixed(2));
                    const bidPrice = parseFloat((currentPrice - (i * (Math.random() * 0.04 + 0.01))).toFixed(2));
                    const askVol = Math.floor(Math.random() * 500) + 15;
