<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIZA Exchange</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Segoe UI', sans-serif;
        background: #0a0a12;
        color: #eee;
        min-height: 100vh;
        padding: 20px 16px 40px;
    }

    .header {
        text-align: center;
        margin-bottom: 18px;
    }
    .header h1 {
        color: #00c6ff;
        font-size: 1.55rem;
    }
    .user {
        color: #00ffcc;
        font-size: 0.95rem;
        margin-top: 4px;
    }

    .balance-box {
        text-align: center;
        margin-bottom: 20px;
    }
    .balance-box .label {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 4px;
    }
    .balances {
        display: flex;
        justify-content: center;
        gap: 28px;
        font-size: 1.3rem;
        font-weight: bold;
    }
    .liza { color: #f7931a; }
    .yo { color: #00c6ff; }

    .panel {
        background: #12121f;
        border: 1px solid #1e2a4a;
        border-radius: 16px;
        padding: 18px;
        max-width: 480px;
        margin: 0 auto;
    }

    .price {
        text-align: center;
        font-size: 1.35rem;
        font-weight: bold;
        color: #00ff88;
        margin-bottom: 3px;
    }
    .pool {
        text-align: center;
        font-size: 0.84rem;
        color: #888;
        margin-bottom: 14px;
    }

    .chart-box {
        background: #0d0d18;
        border-radius: 10px;
        height: 270px;
        margin-bottom: 16px;
        position: relative;
        overflow: hidden;
    }
    #chart {
        width: 100%;
        height: 100%;
        display: block;
    }

    .trade-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
    }
    .trade-box {
        background: #1a1a2e;
        border-radius: 10px;
        padding: 12px;
    }
    .trade-box h4 {
        font-size: 0.9rem;
        color: #aaa;
        margin-bottom: 8px;
    }
    .trade-box input {
        width: 100%;
        background: #0f0f1a;
        border: 1px solid #333;
        color: white;
        padding: 9px 11px;
        border-radius: 7px;
        font-size: 0.95rem;
        margin-bottom: 8px;
    }
    .btn-buy {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 7px;
        background: #00aa55;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
    .btn-sell {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 7px;
        background: #cc3333;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .history-title {
        font-size: 0.9rem;
        color: #aaa;
        margin-bottom: 8px;
    }
    .history {
        max-height: 150px;
        overflow-y: auto;
        font-size: 0.84rem;
    }
    .trade-item {
        display: flex;
        justify-content: space-between;
        padding: 5px 0;
        border-bottom: 1px solid #222;
    }

    #auth {
        position: fixed;
        inset: 0;
        background: #0a0a12;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
    }
    .auth-box {
        background: #151525;
        border: 1px solid #00c6ff;
        border-radius: 14px;
        padding: 28px;
        width: 320px;
        text-align: center;
    }
    .auth-box h2 {
        color: #00c6ff;
        margin-bottom: 18px;
    }
    .auth-box input {
        width: 100%;
        background: #0f0f1a;
        border: 1px solid #333;
        color: white;
        padding: 11px;
        border-radius: 8px;
        margin-bottom: 10px;
        font-size: 1rem;
    }
    .auth-box button {
        width: 100%;
        padding: 12px;
        background: #00c6ff;
        color: #000;
        border: none;
        border-radius: 8px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 4px;
    }
    .switch {
        margin-top: 14px;
        font-size: 0.9rem;
        color: #888;
        cursor: pointer;
    }
    .switch span { color: #00aaff; }
    .err {
        color: #ff5555;
        margin-top: 12px;
        font-size: 0.9rem;
        min-height: 18px;
    }
</style>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<div id="auth">
    <div class="auth-box">
        <h2>LIZA Exchange</h2>
        <div id="loginForm">
            <input type="text" id="nick" placeholder="Никнейм" maxlength="20">
            <input type="password" id="pass" placeholder="Пароль" maxlength="30">
            <button onclick="login()">Войти</button>
            <div class="switch" onclick="showRegister()">Нет аккаунта? <span>Создать</span></div>
        </div>
        <div id="registerForm" style="display:none">
            <input type="text" id="regNick" placeholder="Никнейм" maxlength="20">
            <input type="password" id="regPass" placeholder="Пароль" maxlength="30">
            <input type="password" id="regPass2" placeholder="Повтор пароля" maxlength="30">
            <button onclick="register()">Создать</button>
            <div class="switch" onclick="showLogin()">Уже есть аккаунт? <span>Войти</span></div>
        </div>
        <div class="err" id="err"></div>
    </div>
</div>

<div id="app" style="display:none">
    <div class="header">
        <h1>LIZA Exchange</h1>
        <div class="user" id="userName">-</div>
    </div>

    <div class="balance-box">
        <div class="label">Твой баланс</div>
        <div class="balances">
            <div class="liza"><span id="balLiza">0</span> LIZA</div>
            <div class="yo"><span id="balYo">0</span> YO</div>
        </div>
    </div>

    <div class="panel">
        <div class="price">1 YO = <span id="price">1.0000</span> LIZA</div>
        <div class="pool">Пул: <span id="poolLiza">1 000 000</span> LIZA + <span id="poolYo">1 000 000</span> YO</div>

        <div class="chart-box">
            <canvas id="chart"></canvas>
        </div>

        <div class="trade-row">
            <div class="trade-box">
                <h4>Купить YO</h4>
                <input type="number" id="buyInput" placeholder="Сумма LIZA">
                <button class="btn-buy" onclick="buy()">Купить</button>
            </div>
            <div class="trade-box">
                <h4>Продать YO</h4>
                <input type="number" id="sellInput" placeholder="Сумма YO">
                <button class="btn-sell" onclick="sell()">Продать</button>
            </div>
        </div>

        <div class="history-title">Последние сделки</div>
        <div class="history" id="history"></div>
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
    authDomain: "lizatest-124da.firebaseapp.com",
    databaseURL: "https://lizatest-124da-default-rtdb.firebaseio.com",
    projectId: "lizatest-124da",
    storageBucket: "lizatest-124da.firebasestorage.app",
    messagingSenderId: "88106031938",
    appId: "1:88106031938:web:0b3b08517e71ce33aa06db"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let nick = "";
let balLiza = 0;
let balYo = 0;
let poolLiza = 1000000;
let poolYo = 1000000;
let candles = [];          // локальная копия
let lastDraw = 0;

function showRegister() {
    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('registerForm').style.display = 'block';
    document.getElementById('err').innerText = '';
}
function showLogin() {
    document.getElementById('registerForm').style.display = 'none';
    document.getElementById('loginForm').style.display = 'block';
    document.getElementById('err').innerText = '';
}

function login() {
    const n = document.getElementById('nick').value.trim().toLowerCase();
    const p = document.getElementById('pass').value;
    if (!n || !p) return document.getElementById('err').innerText = 'Заполни поля';

    db.ref('users/' + n).once('value').then(snap => {
        if (!snap.exists()) return document.getElementById('err').innerText = 'Пользователь не найден';
        if (snap.val().password !== p) return document.getElementById('err').innerText = 'Неверный пароль';
        start(n, snap.val());
    });
}

function register() {
    const n = document.getElementById('regNick').value.trim().toLowerCase();
    const p = document.getElementById('regPass').value;
    const p2 = document.getElementById('regPass2').value;

    if (n.length < 3) return document.getElementById('err').innerText = 'Ник минимум 3 символа';
    if (!/^[a-z0-9_]+$/.test(n)) return document.getElementById('err').innerText = 'Только латиница и цифры';
    if (p.length < 4) return document.getElementById('err').innerText = 'Пароль минимум 4 символа';
    if (p !== p2) return document.getElementById('err').innerText = 'Пароли не совпадают';

    db.ref('users/' + n).once('value').then(snap => {
        if (snap.exists()) return document.getElementById('err').innerText = 'Ник занят';
        const data = { password: p, balance: 50000, yoBalance: 1000 };
        db.ref('users/' + n).set(data).then(() => start(n, data));
    });
}

function start(n, data) {
    nick = n;
    balLiza = Number(data.balance) || 0;
    balYo = Number(data.yoBalance) || 0;

    document.getElementById('auth').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('userName').innerText = nick;

    // Пул
    db.ref('exchange/pool').on('value', snap => {
        const d = snap.val();
        if (d) {
            poolLiza = Number(d.liza) || 1000000;
            poolYo = Number(d.yo) || 1000000;
        }
        updatePrice();
    });

    // Свечи — слушаем аккуратно
    db.ref('exchange/candles').limitToLast(40).on('value', snap => {
        const val = snap.val();
        if (!val) return; // не трогаем график если данных нет

        const arr = Object.values(val).sort((a, b) => a.t - b.t);
        if (arr.length === 0) return;

        candles = arr; // обновляем только когда есть данные
        draw();
    });

    // История
    db.ref('exchange/trades').limitToLast(15).on('value', snap => {
        const val = snap.val() || {};
        const list = Object.values(val).sort((a, b) => b.t - a.t);
        renderHistory(list);
    });

    updateBalance();
    // На всякий случай рисуем через секунду
    setTimeout(draw, 600);
}

function getPrice() {
    return poolYo > 0 ? poolLiza / poolYo : 1;
}

function updatePrice() {
    document.getElementById('price').innerText = getPrice().toFixed(4);
    document.getElementById('poolLiza').innerText = Math.floor(poolLiza).toLocaleString('ru');
    document.getElementById('poolYo').innerText = Math.floor(poolYo).toLocaleString('ru');
}

function updateBalance() {
    document.getElementById('balLiza').innerText = Math.floor(balLiza).toLocaleString('ru');
    document.getElementById('balYo').innerText = balYo.toLocaleString('ru', {maximumFractionDigits: 4});
}

function buy() {
    const amount = parseFloat(document.getElementById('buyInput').value);
    if (!amount || amount <= 0) return;
    if (amount > balLiza) return alert('Недостаточно LIZA');

    const k = poolLiza * poolYo;
    const newLiza = poolLiza + amount;
    const newYo = k / newLiza;
    const got = poolYo - newYo;

    balLiza -= amount;
    balYo += got;
    poolLiza = newLiza;
    poolYo = newYo;

    const price = getPrice();
    const now = Date.now();

    const candle = {
        o: price * 0.9995,
        h: price * 1.0015,
        l: price * 0.9985,
        c: price,
        v: amount,
        t: now
    };

    // Сразу добавляем локально, чтобы не мигало
    candles.push(candle);
    if (candles.length > 40) candles.shift();
    draw();

    db.ref('users/' + nick).update({ balance: balLiza, yoBalance: balYo });
    db.ref('exchange/pool').set({ liza: poolLiza, yo: poolYo });
    db.ref('exchange/candles').push(candle);
    db.ref('exchange/trades').push({
        type: 'buy',
        amount: got,
        price: price,
        user: nick,
        t: now
    });

    updateBalance();
    updatePrice();
    document.getElementById('buyInput').value = '';
}

function sell() {
    const amount = parseFloat(document.getElementById('sellInput').value);
    if (!amount || amount <= 0) return;
    if (amount > balYo) return alert('Недостаточно YO');

    const k = poolLiza * poolYo;
    const newYo = poolYo + amount;
    const newLiza = k / newYo;
    const got = poolLiza - newLiza;

    balYo -= amount;
    balLiza += got;
    poolYo = newYo;
    poolLiza = newLiza;

    const price = getPrice();
    const now = Date.now();

    const candle = {
        o: price * 1.0005,
        h: price * 1.0015,
        l: price * 0.9985,
        c: price,
        v: got,
        t: now
    };

    candles.push(candle);
    if (candles.length > 40) candles.shift();
    draw();

    db.ref('users/' + nick).update({ balance: balLiza, yoBalance: balYo });
    db.ref('exchange/pool').set({ liza: poolLiza, yo: poolYo });
    db.ref('exchange/candles').push(candle);
    db.ref('exchange/trades').push({
        type: 'sell',
        amount: amount,
        price: price,
        user: nick,
        t: now
    });

    updateBalance();
    updatePrice();
    document.getElementById('sellInput').value = '';
}

function renderHistory(list) {
    const box = document.getElementById('history');
    if (!list.length) {
        box.innerHTML = '<div style="color:#666;text-align:center;padding:12px">Пока нет сделок</div>';
        return;
    }
    box.innerHTML = list.map(t => `
        <div class="trade-item">
            <span style="color:${t.type==='buy'?'#00ff88':'#ff5555'}">${t.type==='buy'?'BUY':'SELL'} ${Number(t.amount).toFixed(2)}</span>
            <span>${Number(t.price).toFixed(4)}</span>
            <span style="color:#888">${t.user}</span>
        </div>
    `).join('');
}

function draw() {
    // Защита от слишком частого рисования
    const now = Date.now();
    if (now - lastDraw < 80) return;
    lastDraw = now;

    const canvas = document.getElementById('chart');
    if (!canvas) return;

    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    const w = rect.width;
    const h = rect.height;

    if (w < 50 || h < 50) return;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Фон
    ctx.fillStyle = '#0d0d18';
    ctx.fillRect(0, 0, w, h);

    if (candles.length === 0) {
        ctx.fillStyle = '#555';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Сделайте первую сделку', w/2, h/2);
        return;
    }

    const data = candles.slice(-35);
    const chartH = h * 0.68;
    const volH = h * 0.26;

    let minP = Math.min(...data.map(c => c.l));
    let maxP = Math.max(...data.map(c => c.h));
    const pad = (maxP - minP) * 0.14 || 0.008;
    minP -= pad;
    maxP += pad;
    const range = maxP - minP;
    const maxV = Math.max(...data.map(c => c.v)) || 1;

    // Сетка
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.lineWidth = 1;

    for (let i = 0; i <= 4; i++) {
        const y = 16 + (i / 4) * (chartH - 12);
        const p = maxP - (i / 4) * range;
        ctx.beginPath();
        ctx.moveTo(50, y);
        ctx.lineTo(w - 8, y);
        ctx.stroke();
        ctx.fillText(p.toFixed(4), 4, y + 3);
    }

    // Свечи + объём
    const cw = Math.max(5, (w - 65) / data.length - 2.2);

    data.forEach((c, i) => {
        const x = 54 + i * (cw + 2.2);

        const yH = 16 + ((maxP - c.h) / range) * (chartH - 12);
        const yL = 16 + ((maxP - c.l) / range) * (chartH - 12);
        const yO = 16 + ((maxP - c.o) / range) * (chartH - 12);
        const yC = 16 + ((maxP - c.c) / range) * (chartH - 12);

        const up = c.c >= c.o;
        const col = up ? '#00c853' : '#ff1744';

        // Тень
        ctx.beginPath();
        ctx.strokeStyle = col;
        ctx.lineWidth = 1.4;
        ctx.moveTo(x + cw/2, yH);
        ctx.lineTo(x + cw/2, yL);
        ctx.stroke();

        // Тело
        const top = Math.min(yO, yC);
        const height = Math.max(2, Math.abs(yC - yO));
        ctx.fillStyle = col;
        ctx.fillRect(x, top, cw, height);

        // Объём
        const vh = (c.v / maxV) * (volH - 6);
        ctx.fillStyle = up ? 'rgba(0,200,83,0.4)' : 'rgba(255,23,68,0.4)';
        ctx.fillRect(x, h - 6 - vh, cw, vh);
    });

    // Последняя цена
    const last = data[data.length - 1].c;
    ctx.fillStyle = '#00ff88';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(last.toFixed(4), w - 10, 14);
}

window.addEventListener('resize', () => setTimeout(draw, 100));
</script>
</body>
</html>
