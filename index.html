<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LIZABITCOIN - Fixed Rewards & Colors</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #252525; border-right: 2px solid #f7931a; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .sidebar h3 { color:#f7931a; margin-top:0; }
        .user-list { overflow-y: auto; flex-grow: 1; }
        .user-item { padding: 8px 0; border-bottom: 1px solid #333; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; }
        
        .arch-panel { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .arch-btn { background: #333; color: #888; border: 1px solid #555; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .arch-btn.active { background: #f7931a; color: white; border-color: #f7931a; box-shadow: 0 0 10px rgba(247, 147, 26, 0.5); }
        .arch-btn:disabled { background: #222; color: #444; border-color: #333; cursor: not-allowed; }

        button.click-btn { background: #f7931a; color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        
        /* ИСПРАВЛЕНО: Кнопка по умолчанию оранжево-желтая */
        #lizaButton { background: #f7931a; color: white; border: none; width: 200px; height: 200px; border-radius: 50%; font-size: 2rem; margin-top: 20px; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 20px rgba(247, 147, 26, 0.4); }
        #lizaButton:active { transform: scale(0.95); }
        
        /* В 64-битном режиме меняет цвет на бирюзовый */
        #lizaButton.mode-64 { background: #00ffcc; color: #1a1a1a; box-shadow: 0 0 25px rgba(0, 255, 204, 0.6); }
        
        input { padding: 12px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 1rem; text-align: center; margin-bottom: 10px; }
        .upgrade-text { font-size: 0.85rem; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>Dashboard</h3>
        <div id="userList" class="user-list">Список пуст...</div>
    </div>

    <div class="main-content">
        <div class="arch-panel" id="archPanel" style="display: none;">
            <button id="btn32" class="arch-btn active" onclick="switchArch(32)">32-BIT MODE</button>
            <button id="btn64" class="arch-btn" onclick="switchArch(64)" disabled>64-BIT (LOCK)</button>
        </div>

        <div id="authBlock">
            <h2 style="color:#f7931a;">LIZABITCOIN</h2>
            <p>Введи свой никнейм для запуска ядра:</p>
            <input type="text" id="usernameInput" placeholder="Твой ник"><br>
            <button class="click-btn" onclick="login()">Запустить ядро</button>
        </div>

        <div id="gameBlock" style="display: none;">
            <p>Система: <strong id="nameDisplay" style="color:#f7931a;">-</strong> | Ядро: <strong id="archDisplay" style="color:#f7931a;">32-разрядное</strong></p>
            <h1 style="font-size: 3rem; margin: 10px 0;"><span id="balanceDisplay">0</span> LIZA</h1>
            <p style="color:#aaa;">За клик: +<span id="rewardDisplay">50</span> LIZA | Лимит архитектуры: <span id="maxSupplyDisplay">2,147,483,647</span></p>
            
            <button id="lizaButton" onclick="handleTap()">LIZA</button>
            <div id="upgradeHint" class="upgrade-text">Накликай 1,000,000,000 LIZA, чтобы разблокировать 64-битный процессор!</div>
        </div>
    </div>

    <script>
        let myName = "";
        let myBalance = 0;
        let globalSupply = 0;
        let currentArch = 32;

        const LIMIT_32 = 2147483647; 
        const LIMIT_64 = 9223372036854775807; 

        // ИСПРАВЛЕНО: Теперь на 32-бит дает 50 монет, а на 64-бит дает 250 монет
        function calculateReward(arch) {
            return arch === 64 ? 250 : 50;
        }

        function login() {
            const input = document.getElementById('usernameInput').value.trim();
            if (!input) return alert("Ник не может быть пустым!");
            myName = input.replace(/[\.\$\#\[\]\/]/g, "_");
            
            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('gameBlock').style.display = 'block';
            document.getElementById('archPanel').style.display = 'flex';
            document.getElementById('nameDisplay').innerText = myName;

            let usersData = JSON.parse(localStorage.getItem('local_users')) || {};
            if (!usersData[myName]) {
                usersData[myName] = { balance: 0, arch: 32 };
                localStorage.setItem('local_users', JSON.stringify(usersData));
            } else {
                currentArch = usersData[myName].arch || 32;
            }

            switchArch(currentArch);
            setInterval(updateData, 1000);
        }

        function switchArch(bits) {
            currentArch = bits;
            let usersData = JSON.parse(localStorage.getItem('local_users')) || {};
            usersData[myName].arch = bits;
            localStorage.setItem('local_users', JSON.stringify(usersData));

            const btn32 = document.getElementById('btn32');
            const btn64 = document.getElementById('btn64');
            const lizaBtn = document.getElementById('lizaButton');
            const archDisplay = document.getElementById('archDisplay');
            const maxSupplyDisplay = document.getElementById('maxSupplyDisplay');

            if (bits === 64) {
                btn32.classList.remove('active');
                btn64.classList.add('active');
                lizaBtn.classList.add('mode-64');
                archDisplay.innerText = "64-разрядное INT64";
                maxSupplyDisplay.innerText = "9,223,372,036,854,775,807";
            } else {
                btn64.classList.remove('active');
                btn32.classList.add('active');
                lizaBtn.classList.remove('mode-64');
                archDisplay.innerText = "32-разрядное INT32";
                maxSupplyDisplay.innerText = "2,147,483,647";
            }
            updateData();
        }

        function updateData() {
            if (!myName) return;
            
            let usersData = JSON.parse(localStorage.getItem('local_users')) || {};
            
            myBalance = usersData[myName] ? usersData[myName].balance : 0;
            document.getElementById('balanceDisplay').innerText = myBalance.toLocaleString();
            document.getElementById('rewardDisplay').innerText = calculateReward(currentArch);

            const btn64 = document.getElementById('btn64');
            const upgradeHint = document.getElementById('upgradeHint');
            if (myBalance >= 1000000000) {
                btn64.removeAttribute('disabled');
                upgradeHint.innerText = "🔥 Доступен апгрейд до 64-бит! Переключите режим в правом верхнем углу.";
                upgradeHint.style.color = "#00ffcc";
            }

            const listDiv = document.getElementById('userList');
            listDiv.innerHTML = '';
            Object.keys(usersData).forEach(u => {
                const div = document.createElement('div');
                div.className = 'user-item';
                const userArch = usersData[u].arch ? usersData[u].arch + "-bit" : "32-bit";
                div.innerHTML = "<span>" + u + " (" + userArch + ")</span><strong>" + (usersData[u].balance || 0).toLocaleString() + "</strong>";
                listDiv.appendChild(div);
            });
        }

        function handleTap() {
            if (!myName) return;
            
            const currentReward = calculateReward(currentArch);
            const limit = currentArch === 64 ? LIMIT_64 : LIMIT_32;
            
            if (myBalance + currentReward > limit) {
                alert("Ошибка переполнения! Достигнут лимит 32-битной архитектуры. Срочно переключитесь на 64-бит!");
                return;
            }

            let usersData = JSON.parse(localStorage.getItem('local_users')) || {};
            myBalance += currentReward;
            usersData[myName].balance = myBalance;
            
            localStorage.setItem('local_users', JSON.stringify(usersData));
            updateData();
        }
    </script>
</body>
</html>
