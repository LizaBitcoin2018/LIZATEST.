<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIZABITCOIN - DASHBOARD FIXED</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent-color: #f7931a; --sidebar-bg: #252525; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background-color: var(--sidebar-bg); border-right: 2px solid var(--accent-color); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; }
        .sidebar h2 { color: var(--accent-color); margin-top: 0; border-bottom: 1px solid #444; padding-bottom: 10px; font-size: 1.2rem; }
        .user-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex-grow: 1; }
        .user-item { padding: 10px; border-bottom: 1px solid #333; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 20px; }
        .header-actions { position: absolute; top: 20px; right: 20px; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        #lizaButton { width: 200px; height: 200px; border-radius: 50%; font-size: 2rem; box-shadow: 0 0 20px rgba(247, 147, 26, 0.4); }
        #lizaButton:disabled { background-color: #555; cursor: not-allowed; box-shadow: none; }
        .info-text { margin-top: 20px; color: #00ffcc; text-align: center; max-width: 400px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Dashboard -->
    <div class="sidebar">
        <h2>Wallets Dashboard</h2>
        <ul id="userList" class="user-list">
            <li class="user-item">Загрузка данных...</li>
        </ul>
    </div>

    <!-- Main Game Area -->
    <div class="main-content">
        <div class="header-actions">
            <button id="connectWallet" onclick="connectMetaMask()">Connect MetaMask</button>
        </div>

        <div style="text-align: center; margin-bottom: 30px;">
            <div style="font-size: 1.2rem; color: #888;">BALANCE</div>
            <div id="balanceDisplay" style="font-size: 3rem; font-weight: bold; margin: 5px 0;">0.00</div>
            <div style="color: #aaa;">Reward per click: <span id="rewardDisplay">50</span> LIZA</div>
            <div style="font-size: 0.9rem; color: #666; margin-top: 5px;">Total Supply: <span id="supplyDisplay">0</span> / 21,000,000</div>
        </div>

        <button id="lizaButton" onclick="handleTap()" disabled>LIZA</button>
        <div id="statusMessage" class="info-text">Система готова. Синхронизация...</div>
    </div>

    <script>
        // ИСПРАВЛЕНО: Убран лишний дефис в названии вашей базы данных
        const DB_URL = "https://firebaseio.com";

        let currentAccount = null;
        let userBalance = 0;
        let totalGlobalSupply = 0;
        const MAX_SUPPLY = 21000000;

        function calculateReward(supply) {
            let baseReward = 50;
            const halvingEra = Math.floor(supply / 5250000);
            let currentReward = baseReward / Math.pow(2, halvingEra);
            return currentReward > 0 ? currentReward : 0;
        }

        function handleWalletConnected(address) {
            currentAccount = address[0].toLowerCase();
            document.getElementById('connectWallet').innerText = currentAccount.substring(0, 6) + "...";
            document.getElementById('lizaButton').removeAttribute('disabled');
            document.getElementById('statusMessage').innerText = "Кошелек подключен! Начинай майнинг.";
            updateDataFromServer();
        }

        async function checkExistingConnection() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                    if (accounts && accounts.length > 0) {
                        handleWalletConnected(accounts);
                    } else {
                        document.getElementById('statusMessage').innerText = "Кошелек не подключен. Нажмите Connect MetaMask.";
                    }
                } catch (err) {
                    console.error("Ошибка автоподключения:", err);
                }
            } else {
                document.getElementById('statusMessage').innerText = "MetaMask не найден.";
            }
        }

        // Обновление данных с Firebase через REST API
        async function updateDataFromServer() {
            try {
                const res = await fetch(`${DB_URL}.json`);
                const data = await res.json();
                
                // Обновляем саплай глобально, даже если база полностью пустая
                totalGlobalSupply = (data && data.global) ? data.global.totalSupply : 0;
                document.getElementById('supplyDisplay').innerText = totalGlobalSupply.toLocaleString();
                document.getElementById('rewardDisplay').innerText = calculateReward(totalGlobalSupply);

                if (currentAccount && data && data.users && data.users[currentAccount]) {
                    userBalance = data.users[currentAccount].balance || 0;
                    document.getElementById('balanceDisplay').innerText = userBalance.toFixed(2);
                }

                const userList = document.getElementById('userList');
                userList.innerHTML = '';
                
                if (data && data.users) {
                    Object.keys(data.users).forEach(addr => {
                        const shortAddr = addr.substring(0, 6) + "..." + addr.substring(38);
                        const bal = data.users[addr].balance || 0;
                        const li = document.createElement('li');
                        li.className = 'user-item';
                        li.innerHTML = `<span>${shortAddr}</span><strong>${bal.toFixed(2)}</strong>`;
                        userList.appendChild(li);
                    });
                } else {
                    userList.innerHTML = '<li class="user-item" style="color: #888;">Нет активных майнеров</li>';
                }
            } catch (err) {
                console.error("Ошибка обновления данных:", err);
            }
        }

        async function connectMetaMask() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    document.getElementById('statusMessage').innerText = "Ожидание авторизации в MetaMask...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    if (accounts && accounts.length > 0) {
                        handleWalletConnected(accounts);
                    }
                } catch (error) {
                    alert("Ошибка MetaMask: " + error.message);
                    document.getElementById('statusMessage').innerText = "Вход отменен.";
                }
            } else {
                alert("MetaMask не установлен!");
            }
        }

        async function handleTap() {
            if (!currentAccount) return;

            const reward = calculateReward(totalGlobalSupply);
            if (totalGlobalSupply + reward > MAX_SUPPLY) {
                document.getElementById('statusMessage').innerText = "Лимит в 21 000 000 LIZA достигнут!";
                return;
            }

            const nextUserBalance = userBalance + reward;
            const nextGlobalSupply = totalGlobalSupply + reward;

            userBalance = nextUserBalance;
            totalGlobalSupply = nextGlobalSupply;
            document.getElementById('balanceDisplay').innerText = userBalance.toFixed(2);
            document.getElementById('supplyDisplay').innerText = totalGlobalSupply.toLocaleString();

            try {
                await fetch(`${DB_URL}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify({
                        [`users/${currentAccount}/balance`]: nextUserBalance,
                        [`global/totalSupply`]: nextGlobalSupply
                    })
                });
            } catch (err) {
                console.error("Ошибка сохранения клика:", err);
            }
        }

        // Запуск интервала фонового обновления
        setInterval(updateDataFromServer, 2000);
        window.addEventListener('load', () => {
            updateDataFromServer();
            checkExistingConnection();
        });

        if (typeof window.ethereum !== 'undefined') {
            window.ethereum.on('accountsChanged', function (accounts) {
                if (accounts.length > 0) {
                    handleWalletConnected(accounts);
                } else {
                    currentAccount = null;
                    document.getElementById('lizaButton').setAttribute('disabled', 'true');
                    document.getElementById('connectWallet').innerText = "Connect MetaMask";
                    document.getElementById('balanceDisplay').innerText = "0.00";
                    document.getElementById('statusMessage').innerText = "Кошелек отключен.";
                }
            });
        }
    </script>
</body>
</html>
