<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LIZABITCOIN - MetaMask</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            padding-bottom: 20px;
        }
        .sidebar {
            width: 100%;
            background: #252525;
            border-top: 2px solid #f7931a;
            padding: 15px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            max-height: 220px;
        }
        .sidebar h3 {
            color: #f7931a;
            margin: 0 0 10px 0;
            font-size: 1rem;
        }
        .user-list {
            overflow-y: auto;
            flex-grow: 1;
        }
        .user-item {
            padding: 6px 0;
            border-bottom: 1px solid #333;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        
        .arch-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .arch-btn {
            background: #333;
            color: #888;
            border: 1px solid #555;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .arch-btn.active {
            background: #f7931a;
            color: white;
            border-color: #f7931a;
            box-shadow: 0 0 10px rgba(247, 147, 26, 0.5);
        }
        .arch-btn:disabled {
            background: #222;
            color: #444;
            border-color: #333;
            cursor: not-allowed;
        }

        button.click-btn {
            background: #f7931a;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        button.click-btn:hover {
            background: #e07b00;
        }

        #lizaButton {
            background: #f7931a;
            color: white;
            border: none;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            font-size: 2rem;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(247, 147, 26, 0.4);
        }
        #lizaButton:active {
            transform: scale(0.95);
        }
        #lizaButton:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }
        #lizaButton.mode-64 {
            background: #00ffcc;
            color: #1a1a1a;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
        }

        .upgrade-text {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 5px;
        }
        .address {
            color: #00ffcc;
            font-family: monospace;
        }
    </style>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="main-content">
        <div class="arch-panel" id="archPanel" style="display: none;">
            <button id="btn32" class="arch-btn active" onclick="switchArch(32)">32-BIT MODE</button>
            <button id="btn64" class="arch-btn" onclick="switchArch(64)" disabled>64-BIT (LOCK)</button>
        </div>

        <div id="authBlock">
            <h2 style="color:#f7931a;">LIZABITCOIN</h2>
            <p>Подключи MetaMask, чтобы запустить ядро</p>
            <br>
            <button class="click-btn" onclick="connectMetaMask()">Подключить MetaMask</button>
            <p id="errorText" style="color:#ff5555; margin-top:15px;"></p>
        </div>

        <div id="gameBlock" style="display: none;">
            <p>Кошелёк: <strong class="address" id="nameDisplay">-</strong></p>
            <p>Ядро: <strong id="archDisplay" style="color:#f7931a;">32-разрядное</strong></p>
            <h1 style="font-size: 3rem; margin: 10px 0;"><span id="balanceDisplay">0</span> LIZA</h1>
            <p style="color:#aaa;">
                За клик: +<span id="rewardDisplay">50</span> LIZA | 
                Кликов: <span id="clicksDisplay">0</span> |
                Лимит: <span id="maxSupplyDisplay">2,147,483,647</span>
            </p>
            
            <button id="lizaButton" onclick="handleTap()">LIZA</button>
            <div id="upgradeHint" class="upgrade-text">Накликай 1,000,000,000 LIZA, чтобы разблокировать 64-бит</div>
        </div>
    </div>

    <div class="sidebar">
        <h3>Dashboard (Online)</h3>
        <div id="userList" class="user-list">Подключите кошелёк...</div>
    </div>

    <script>
        // Твой Firebase конфиг
        const firebaseConfig = {
            apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
            authDomain: "lizatest-124da.firebaseapp.com",
            databaseURL: "https://lizatest-124da-default-rtdb.firebaseio.com",
            projectId: "lizatest-124da",
            storageBucket: "lizatest-124da.firebasestorage.app",
            messagingSenderId: "88106031938",
            appId: "1:88106031938:web:0b3b08517e71ce33aa06db",
            measurementId: "G-HT8D6XRFSY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myAddress = "";
        let myBalance = 0;
        let myClicks = 0;          // счётчик кликов
        let currentArch = 32;
        let isClickOnCooldown = false;

        const LIMIT_32 = 2147483647;
        const LIMIT_64 = 9223372036854775807n;

        // Награда: 50 + 50 за каждые 10 кликов
        function calculateReward() {
            return 50 + Math.floor(myClicks / 10) * 50;
        }

        // Подключение MetaMask
        async function connectMetaMask() {
            const errorText = document.getElementById('errorText');
            errorText.innerText = "";

            if (typeof window.ethereum === 'undefined') {
                errorText.innerText = "MetaMask не найден. Установите расширение MetaMask.";
                return;
            }

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                myAddress = accounts[0].toLowerCase();

                document.getElementById('authBlock').style.display = 'none';
                document.getElementById('gameBlock').style.display = 'block';
                document.getElementById('archPanel').style.display = 'flex';
                document.getElementById('nameDisplay').innerText = shortAddress(myAddress);

                const userRef = db.ref('users/' + myAddress);
                userRef.once('value').then(snapshot => {
                    if (!snapshot.exists()) {
                        userRef.set({ balance: 0, arch: 32, clicks: 0 });
                        currentArch = 32;
                        myBalance = 0;
                        myClicks = 0;
                    } else {
                        const data = snapshot.val();
                        myBalance = data.balance || 0;
                        currentArch = data.arch || 32;
                        myClicks = data.clicks || 0;
                    }
                    switchArch(currentArch);
                });

                db.ref('users').on('value', snapshot => {
                    updateDashboard(snapshot.val());
                });

            } catch (err) {
                console.error(err);
                errorText.innerText = "Ошибка подключения MetaMask";
            }
        }

        function shortAddress(addr) {
            return addr.slice(0, 6) + "..." + addr.slice(-4);
        }

        function switchArch(bits) {
            currentArch = bits;
            db.ref('users/' + myAddress + '/arch').set(bits);

            const btn32 = document.getElementById('btn32');
            const btn64 = document.getElementById('btn64');
            const lizaBtn = document.getElementById('lizaButton');
            const archDisplay = document.getElementById('archDisplay');
            const maxSupplyDisplay = document.getElementById('maxSupplyDisplay');

            if (bits === 64) {
                btn32.classList.remove('active');
                btn64.classList.add('active');
                lizaBtn.classList.add('mode-64');
                archDisplay.innerText = "64-разрядное INT64";
                maxSupplyDisplay.innerText = "9,223,372,036,854,775,807";
            } else {
                btn64.classList.remove('active');
                btn32.classList.add('active');
                lizaBtn.classList.remove('mode-64');
                archDisplay.innerText = "32-разрядное INT32";
                maxSupplyDisplay.innerText = "2,147,483,647";
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = myBalance.toLocaleString();
            document.getElementById('rewardDisplay').innerText = calculateReward();
            document.getElementById('clicksDisplay').innerText = myClicks.toLocaleString();

            const btn64 = document.getElementById('btn64');
            const upgradeHint = document.getElementById('upgradeHint');

            if (myBalance >= 1000000000) {
                btn64.removeAttribute('disabled');
                upgradeHint.innerText = "🔥 64-бит доступен! Переключите режим справа сверху.";
                upgradeHint.style.color = "#00ffcc";
            } else {
                btn64.setAttribute('disabled', true);
                upgradeHint.innerText = "Накликай 1,000,000,000 LIZA, чтобы разблокировать 64-бит";
                upgradeHint.style.color = "#aaa";
            }
        }

        function updateDashboard(users) {
            const listDiv = document.getElementById('userList');
            listDiv.innerHTML = '';

            if (!users) {
                listDiv.innerHTML = 'Пока никого нет...';
                return;
            }

            const sorted = Object.entries(users).sort((a, b) => (b[1].balance || 0) - (a[1].balance || 0));

            sorted.forEach(([address, data]) => {
                const div = document.createElement('div');
                div.className = 'user-item';
                const userArch = data.arch ? data.arch + "-bit" : "32-bit";
                div.innerHTML = `
                    <span title="${address}">${shortAddress(address)} (${userArch})</span>
                    <strong>${(data.balance || 0).toLocaleString()}</strong>
                `;
                listDiv.appendChild(div);
            });
        }

        function handleTap() {
            if (!myAddress || isClickOnCooldown) return;

            const currentReward = calculateReward();
            const limit = currentArch === 64 ? Number(LIMIT_64) : LIMIT_32;

            if (myBalance + currentReward > limit) {
                alert("Достигнут лимит архитектуры! Переключитесь на 64-бит.");
                return;
            }

            // Задержка 1 секунда
            isClickOnCooldown = true;
            const btn = document.getElementById('lizaButton');
            btn.disabled = true;

            // Увеличиваем клики и баланс
            myClicks += 1;
            myBalance += currentReward;

            // Сохраняем оба значения
            db.ref('users/' + myAddress).update({
                balance: myBalance,
                clicks: myClicks
            });

            updateUI();

            setTimeout(() => {
                isClickOnCooldown = false;
                btn.disabled = false;
            }, 1000);
        }
    </script>
</body>
</html>
