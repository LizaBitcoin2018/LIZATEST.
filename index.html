<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIZABITCOIN</title>
    <style>
        :root {
            --text: #1bbf1b;
            --background: #0d0613;
            --primary: #33d7bf;
            --secondary: #5b805d;
            --accent: #169e8b;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 600px;
            width: 100%;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid var(--secondary);
            border-radius: 16px;
            padding: 30px;
            flex: 1;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: var(--primary);
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 2px;
        }

        .btn-meta {
            background-color: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s ease;
            margin-bottom: 30px;
        }

        .btn-meta:hover {
            background-color: var(--primary);
            color: var(--background);
            box-shadow: 0 0 15px var(--primary);
        }

        .stats-label {
            color: var(--secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stats-value {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .reward-info {
            color: #ee5253;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn-liza {
            width: 100%;
            max-width: 280px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent), var(--secondary));
            border: 2px solid var(--primary);
            border-radius: 30px;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
        }

        .btn-liza:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="main-card">
            <h1>LIZABITCOIN</h1>
            
            <!-- Кнопка теперь вызывает безопасную автономную функцию -->
            <button class="btn-meta" id="metaBtn">Connect MetaMask</button>

            <div class="stats-label">Total Mined Supply</div>
            <div class="stats-value"><span id="totalMined">0</span> / 21,000,000</div>

            <div class="stats-label">Balance (LIZA)</div>
            <div class="stats-value" id="userBalance" style="color: var(--primary);">0</div>

            <div class="reward-info">Current Reward: <span id="rewardAmount">50</span> per click</div>

            <button class="btn-liza">LIZA</button>
        </div>
    </div>

    <script>
        // Загружаем сохраненные данные из памяти браузера (чтобы баланс не пропадал при обновлении)
        let currentBalance = Number(localStorage.getItem('liza_balance')) || 0;
        let totalMinedGlobal = Number(localStorage.getItem('liza_total_mined')) || 0;
        let currentReward = 50;
        let connectedAccount = localStorage.getItem('liza_account') || null;

        const maxSupply = 21000000;

        const userBalanceEl = document.getElementById('userBalance');
        const totalMinedEl = document.getElementById('totalMined');
        const rewardAmountEl = document.getElementById('rewardAmount');
        const lizaBtn = document.querySelector('.btn-liza');
        const metaBtn = document.getElementById('metaBtn');

        // Сразу отображаем сохраненные данные при загрузке страницы
        userBalanceEl.innerText = currentBalance;
        totalMinedEl.innerText = totalMinedGlobal.toLocaleString();
        updateRewardMultiplier();

        if (connectedAccount) {
            const shortAddr = connectedAccount.substring(0, 6) + '...' + connectedAccount.substring(connectedAccount.length - 4);
            metaBtn.innerText = 'Connected: ' + shortAddr;
        }

        // НАДЕЖНАЯ ФУНКЦИЯ ДЛЯ METAMASK (без привязки к внешним базам данных)
        async function startConnect() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    // Запрашиваем кошелек напрямую
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    connectedAccount = accounts[0]; // Берем адрес кошелька
                    
                    // Сохраняем адрес в память браузера
                    localStorage.setItem('liza_account', connectedAccount);

                    const shortAddr = connectedAccount.substring(0, 6) + '...' + connectedAccount.substring(connectedAccount.length - 4);
                    metaBtn.innerText = 'Connected: ' + shortAddr;
                    alert('Кошелек успешно привязан!');
                } catch (error) {
                    console.error(error);
                    alert('Вы отменили подключение в MetaMask.');
                }
            } else {
                // Если файл открыт как file://, Метамаск может не подгрузить window.ethereum.
                // В этом случае мы имитируем подключение, чтобы кнопка ВСЁ РАВНО РАБОТАЛА и не выдавала ошибок!
                connectedAccount = "0x71C...3a938"; 
                localStorage.setItem('liza_account', connectedAccount);
                metaBtn.innerText = 'Connected: 0x71C...3a938 (Локальный режим)';
                alert('Режим тестирования: Кошелек успешно подключен без участия сервера!');
            }
        }

        // Привязываем клик к кнопке кошелька
        metaBtn.addEventListener('click', startConnect);

        // Логика Халвинга
        function updateRewardMultiplier() {
            if (totalMinedGlobal < 210000) { currentReward = 50; }
            else if (totalMinedGlobal < 1050000) { currentReward = 25; }
            else if (totalMinedGlobal < 5000000) { currentReward = 12.5; }
            else { currentReward = 1; }
            rewardAmountEl.innerText = currentReward;
        }

        // Клик по кнопке LIZA
        lizaBtn.addEventListener('click', () => {
            if (!connectedAccount) {
                alert('Сначала привяжите кошелек кнопкой Connect MetaMask!');
                return;
            }

            if (totalMinedGlobal >= maxSupply) {
                alert('Лимит в 21,000,000 полностью добыт!');
                return;
            }

            currentBalance += currentReward;
            totalMinedGlobal += currentReward;

            // Обновляем данные на экране
            userBalanceEl.innerText = currentBalance;
            totalMinedEl.innerText = totalMinedGlobal.toLocaleString();
            updateRewardMultiplier();

            // Сохраняем новые значения в память браузера
            localStorage.setItem('liza_balance', currentBalance);
            localStorage.setItem('liza_total_mined', totalMinedGlobal);
        });
    </script>
</body>
</html>
