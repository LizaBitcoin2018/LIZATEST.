<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIZABITCOIN DIAGNOSTIC</title>
    <style>
        :root { --bg-color: #1a1a1a; --text-color: #ffffff; --accent-color: #f7931a; --sidebar-bg: #252525; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 300px; background-color: var(--sidebar-bg); border-right: 2px solid var(--accent-color); padding: 20px; box-sizing: border-box; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .header-actions { position: absolute; top: 20px; right: 20px; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #lizaButton { width: 200px; height: 200px; border-radius: 50%; font-size: 2rem; margin-top: 20px; }
        .info-text { margin-top: 20px; color: #ff5555; font-weight: bold; text-align: center; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul id="userList"><li>Connect wallet...</li></ul>
    </div>

    <div class="main-content">
        <div class="header-actions">
            <button id="connectWallet" onclick="connectMetaMask()">Connect MetaMask</button>
        </div>
        <div>
            <h2>Balance: <span id="balanceDisplay">0.00</span> LIZA</h2>
            <p>Total Supply: <span id="supplyDisplay">0</span> / 21,000,000</p>
        </div>
        <button id="lizaButton" onclick="handleTap()" disabled>LIZA</button>
        <div id="statusMessage" class="info-text">Инициализация...</div>
    </div>

    <!-- Загрузка скриптов -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>

    <script>
        // Проверка загрузки Firebase скриптов
        window.addEventListener('load', () => {
            const status = document.getElementById('statusMessage');
            if (typeof firebase === 'undefined') {
                status.innerText = "КРИТИЧЕСКАЯ ОШИБКА: Браузер полностью заблокировал Firebase! Кнопка работать не будет.";
                alert("Ошибка: Скрипты базы данных Firebase не смогли загрузиться в этом браузере.");
            } else {
                status.innerText = "Firebase успешно загружен. Нажми Connect MetaMask.";
                status.style.color = "#666";
                initFirebase();
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
            authDomain: "://firebaseapp.com",
            projectId: "lizatest-124da",
            storageBucket: "lizatest-124da.firebasestorage.app",
            messagingSenderId: "88106031938",
            appId: "1:88106031938:web:0b3b08517e71ce33aa06db"
        };

        let database;
        let currentAccount = null;
        let userBalance = 0;
        let totalGlobalSupply = 0;

        function initFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                database = firebase.database();
                
                // Слушаем глобальный саплай
                database.ref('global/totalSupply').on('value', (snapshot) => {
                    totalGlobalSupply = snapshot.val() || 0;
                    document.getElementById('supplyDisplay').innerText = totalGlobalSupply;
                }, (error) => {
                    alert("Firebase Read Error: " + error.message);
                });

                // Слушаем список юзеров
                database.ref('users').on('value', (snapshot) => {
                    const userList = document.getElementById('userList');
                    userList.innerHTML = '';
                    const users = snapshot.val();
                    if(users) {
                        Object.keys(users).forEach(addr => {
                            const li = document.createElement('li');
                            li.innerText = addr.substring(0,6) + "...: " + (users[addr].balance || 0);
                            userList.appendChild(li);
                        });
                    }
                });
            } catch(e) {
                alert("Ошибка инициализации базы: " + e.message);
            }
        }

        async function connectMetaMask() {
            alert("Кнопка нажата! Начинаем поиск MetaMask...");
            
            if (typeof window.ethereum !== 'undefined') {
                try {
                    alert("MetaMask обнаружен в браузере. Запрашиваем окно авторизации...");
                    
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    if (accounts && accounts.length > 0) {
                        currentAccount = accounts[0].toLowerCase();
                        
                        alert("Успешно подключено! Ваш адрес: " + currentAccount);
                        
                        document.getElementById('connectWallet').innerText = currentAccount.substring(0, 6) + "...";
                        document.getElementById('lizaButton').removeAttribute('disabled');
                        document.getElementById('statusMessage').innerText = "Кошелек подключен. Кликай!";
                        
                        // Подгружаем баланс кошелька
                        database.ref('users/' + currentAccount).on('value', (snapshot) => {
                            const data = snapshot.val();
                            userBalance = data ? data.balance : 0;
                            document.getElementById('balanceDisplay').innerText = userBalance;
                        });
                    } else {
                        alert("MetaMask вернул пустой список аккаунтов.");
                    }
                } catch (error) {
                    alert("ОШИБКА ВНУТРИ METAMASK:\nКод: " + error.code + "\nСообщение: " + error.message);
                }
            } else {
                alert("КРИТИЧЕСКАЯ ОШИБКА: Расширение MetaMask вообще не найдено в этом браузере! Убедись, что кошелек установлен и включен.");
            }
        }

        function handleTap() {
            if (!currentAccount || !database) return;
            let reward = 50; 
            if (totalGlobalSupply + reward > 21000000) return;

            database.ref('users/' + currentAccount).set({
                balance: userBalance + reward,
                lastUpdated: firebase.database.ServerValue.TIMESTAMP
            });
            database.ref('global/totalSupply').set(totalGlobalSupply + reward);
        }
    </script>
</body>
</html>
