<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LIZABITCOIN</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 250px; background: #252525; border-right: 2px solid #f7931a; padding: 20px; box-sizing: border-box; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; }
        .arch-panel { position: absolute; top: 20px; right: 20px; display: flex; gap: 10px; }
        .arch-btn { background: #333; color: #888; border: 1px solid #555; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .arch-btn.active { background: #f7931a; color: white; border-color: #f7931a; }
        #lizaButton { background: #f7931a; color: white; border: none; width: 200px; height: 200px; border-radius: 50%; font-size: 2rem; margin-top: 20px; cursor: pointer; box-shadow: 0 0 20px rgba(247, 147, 26, 0.4); }
        #lizaButton.mode-64 { background: #00ffcc; color: #1a1a1a; box-shadow: 0 0 25px rgba(0, 255, 204, 0.6); }
        #lizaButton:disabled { background: #555 !important; color: #aaa !important; cursor: not-allowed; box-shadow: none !important; }
        .heat-container { width: 200px; height: 6px; background: #333; border-radius: 3px; margin-top: 15px; display: none; overflow: hidden; }
        .heat-bar { width: 0%; height: 100%; background: #00ffcc; }
        input { padding: 12px; border-radius: 6px; border: 1px solid #444; background: #1a1a1a; color: white; font-size: 1rem; text-align: center; margin-bottom: 10px; }
        .user-item { padding: 8px 0; border-bottom: 1px solid #333; font-size: 0.9rem; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3 style="color:#f7931a; margin-top:0;">Dashboard</h3>
        <div id="userList">Список пуст...</div>
    </div>

    <div class="main-content">
        <div class="arch-panel" id="archPanel" style="display: none;">
            <button id="btn32" class="arch-btn active" onclick="switchArch(32)">32-BIT</button>
            <button id="btn64" class="arch-btn" onclick="switchArch(64)" disabled>64-BIT (LOCK)</button>
        </div>

        <div id="authBlock">
            <h2 style="color:#f7931a;">LIZABITCOIN</h2>
            <input type="text" id="usernameInput" placeholder="Твой ник"><br>
            <button style="background:#f7931a; color:white; border:none; padding:12px 24px; font-weight:bold; border-radius:8px; cursor:pointer;" onclick="login()">Войти</button>
        </div>

        <div id="gameBlock" style="display: none;">
            <p>Игрок: <strong id="nameDisplay" style="color:#f7931a;">-</strong> | Ядро: <strong id="archDisplay">32-разрядное</strong></p>
            <h1 style="font-size: 3rem; margin: 10px 0;"><span id="balanceDisplay">0</span> LIZA</h1>
            <p style="color:#aaa;">За клик: +<span id="rewardDisplay">50</span> LIZA | Лимит: <span id="maxDisplay">2,147,483,647</span></p>
            <button id="lizaButton" onclick="handleTap()">LIZA</button>
            <div id="heatContainer" class="heat-container"><div id="heatBar" class="heat-bar"></div></div>
            <div id="upgradeHint" style="font-size:0.85rem; color:#aaa; margin-top:10px;">Набери 1,000,000,000 LIZA для 64-бит!</div>
        </div>
    </div>

    <script>
        let myName = "";
        let myBalance = 0;
        let currentArch = 32;
        let currentHeat = 0;
        let isCoolingDown = false;

        let audioCtx = null;
        function playSound(freq, duration, type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function login() {
            let input = document.getElementById('usernameInput').value.trim();
            if (!input) return alert("Введите ник!");
            myName = input.replace(/[\.\$\#\[\]\/]/g, "_");
            
            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('gameBlock').style.display = 'block';
            document.getElementById('archPanel').style.display = 'flex';
            document.getElementById('nameDisplay').innerText = myName;

            let usersData = JSON.parse(localStorage.getItem('local_users')) || {};
            if (!usersData[myName]) {
                usersData[myName] = { balance: 0, arch: 32 };
                localStorage.setItem('local_users', JSON.stringify(usersData));
            } else {
                currentArch = usersData[myName].arch || 32;
            }

            switchArch(currentArch);
            setInterval(updateData, 1000);
            setInterval(() => {
                if (currentArch === 64 && !isCoolingDown && currentHeat > 0) {
                    currentHeat = Math.max(0, currentHeat - 5);
                    document.getElementById('heatBar').style.width = currentHeat + "%";
                }
            }, 1000);
        }

        function switchArch(bits) {
            if (isCoolingDown) return;
            currentArch = bits;
            let usersData = JSON.parse(localStorage.getItem('local_users')) || {};
            usersData[myName].arch = bits;
            localStorage.setItem('local_users', JSON.stringify(usersData));

            let lizaBtn = document.getElementById('lizaButton');
            if (bits === 64) {
                document.getElementById('btn32').classList.remove('active');
                document.getElementById('btn64').classList.add('active');
                lizaBtn.classList.add('mode-64');
                document.getElementById('archDisplay').innerText = "64-разрядное INT64";
                document.getElementById('maxDisplay').innerText = "9,223,372,036,854,775,807";
                document.getElementById('heatContainer').style.display = "block";
            } else {
                document.getElementById('btn64').classList.remove('active');
                document.getElementById('btn32').classList.add('active');
                lizaBtn.classList.remove('mode-64');
                document.getElementById('archDisplay').innerText = "32-разрядное INT32";
                document.getElementById('maxDisplay').innerText = "2,147,483,647";
                document.getElementById('heatContainer').style.display = "none";
            }
            updateData();
        }

        function updateData() {
            if (!myName) return;
            let usersData = JSON.parse(localStorage.getItem('local_users')) || {};
            myBalance = usersData[myName] ? usersData[myName].balance : 0;
            
            document.getElementById('balanceDisplay').innerText = myBalance.toLocaleString();
            document.getElementById('rewardDisplay').innerText = currentArch === 64 ? "250" : "50";

            let btn64 = document.getElementById('btn64');
            let hint = document.getElementById('upgradeHint');
            if (myBalance >= 1000000000) {
                btn64.removeAttribute('disabled');
                if (!isCoolingDown) {
                    btn64.innerText = "64-BIT MODE";
                    hint.innerText = "🔥 Доступен 64-битный режим! Переключись вверху.";
                    hint.style.color = "#00ffcc";
                }
            } else {
                if (currentArch !== 64) {
                    btn64.setAttribute('disabled', 'true');
                    btn64.innerText = "64-BIT (LOCK)";
                    hint.innerText = "Набери 1,000,000,000 LIZA для 64-бит!";
                    hint.style.color = "#aaa";
                }
            }

            let listDiv = document.getElementById('userList');
            listDiv.innerHTML = '';
            Object.keys(usersData).forEach(u => {
                let div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = "<span>" + u + " (" + (usersData[u].arch||32) + "-bit)</span><strong>" + (usersData[u].balance||0).toLocaleString() + "</strong>";
                listDiv.appendChild(div);
            });
        }

        function handleTap() {
            if (!myName || isCoolingDown) return;
            let reward = currentArch === 64 ? 250 : 50;

            if (currentArch === 64) {
                playSound(800, 0.1, 'triangle');
                currentHeat += 10;
                document.getElementById('heatBar').style.width = currentHeat + "%";
                if (currentHeat >= 100) {
                    isCoolingDown = true;
                    playSound(200, 0.4, 'sawtooth');
                    document.getElementById('lizaButton').setAttribute('disabled', 'true');
                    document.getElementById('btn64').innerText = "OVERHEAT";
                    hint.innerText = "🚨 ПЕРЕГРЕВ! Охлаждение 10 секунд...";
                    hint.style.color = "#ff3333";
                    setTimeout(() => {
                        isCoolingDown = false;
                        currentHeat = 0;
                        document.getElementById('heatBar').style.width = "0%";
                        document.getElementById('lizaButton').removeAttribute('disabled');
                        switchArch(32);
                    }, 10000);
                    return;
}
} else {
playSound(500, 0.08, 'sine');
}
let usersData = JSON.parse(localStorage.getItem('local_users')) || {};
myBalance += reward;
usersData[myName].balance = myBalance;
localStorage.setItem('local_users', JSON.stringify(usersData));
updateData();
}
