<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIZABITCOIN</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #f7931a;
            --sidebar-bg: #252525;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* Dashboard Sidebar */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            border-right: 2px solid var(--accent-color);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .sidebar h2 {
            color: var(--accent-color);
            margin-top: 0;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            font-size: 1.2rem;
        }
        .user-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }
        .user-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }
        .user-address {
            color: #aaa;
            font-family: monospace;
        }
        .user-balance {
            font-weight: bold;
            color: var(--accent-color);
        }
        /* Main Game Area */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }
        .header-actions {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        button:hover {
            background-color: #e08215;
        }
        button:active {
            transform: scale(0.95);
        }
        #connectWallet {
            background-color: #333;
            border: 1px solid var(--accent-color);
        }
        /* Clicker Elements */
        .stat-box {
            text-align: center;
            margin-bottom: 30px;
        }
        .stat-label {
            font-size: 1.2rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .stat-value {
            font-size: 3rem;
            font-weight: bold;
            color: var(--text-color);
            margin: 5px 0;
        }
        #lizaButton {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            font-size: 2rem;
            box-shadow: 0 0 20px rgba(247, 147, 26, 0.4);
        }
        .info-text {
            margin-top: 20px;
            color: #666;
            font-size: 0.85rem;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <!-- Dashboard Sidebar -->
    <div class="sidebar">
        <h2>Wallets Dashboard</h2>
        <ul id="userList" class="user-list">
            <li class="user-item">Connect wallet to see stats</li>
        </ul>
    </div>

    <!-- Main Game Area -->
    <div class="main-content">
        <div class="header-actions">
            <button id="connectWallet">Connect MetaMask</button>
        </div>

        <div class="stat-box">
            <div class="stat-label">Balance</div>
            <div id="balanceDisplay" class="stat-value">0.00</div>
            <div style="color: #aaa;">Reward per click: <span id="rewardDisplay">50</span> LIZA</div>
            <div style="font-size: 0.9rem; color: #666; margin-top: 5px;">Total Supply: <span id="supplyDisplay">0</span> / 21,000,000</div>
        </div>

        <button id="lizaButton" disabled>LIZA</button>
        <div id="statusMessage" class="info-text">Please connect your MetaMask wallet to start mining.</div>
    </div>

    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // Конфиг Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
            authDomain: "lizatest-124da.firebaseapp.com",
            projectId: "lizatest-124da",
            storageBucket: "lizatest-124da.firebasestorage.app",
            messagingSenderId: "88106031938",
            appId: "1:88106031938:web:0b3b08517e71ce33aa06db",
            measurementId: "G-HT8D6XRFSY"
        };

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Переменные состояния игрока
        let currentAccount = null;
        let userBalance = 0;
        let totalGlobalSupply = 0;
        const MAX_SUPPLY = 21000000;

        // DOM элементы
        const connectBtn = document.getElementById('connectWallet');
        const lizaBtn = document.getElementById('lizaButton');
        const balanceDisplay = document.getElementById('balanceDisplay');
        const rewardDisplay = document.getElementById('rewardDisplay');
        const supplyDisplay = document.getElementById('supplyDisplay');
        const userList = document.getElementById('userList');
        const statusMessage = document.getElementById('statusMessage');

        // Расчет текущей награды на основе общего саплая (Халвинг модели Биткоина)
        function calculateReward(globalSupply) {
            let baseReward = 50;
            const halvingEra = Math.floor(globalSupply / 5250000);
            let currentReward = baseReward / Math.pow(2, halvingEra);
            return currentReward > 0 ? currentReward : 0;
        }

        // Подключение кошелька MetaMask
        async function connectMetaMask() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    statusMessage.innerText = "Connecting to MetaMask...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    
                    // ИСПРАВЛЕНО: Берем первый элемент массива аккаунтов [0]
                    currentAccount = accounts[0].toLowerCase();
                    
                    connectBtn.innerText = currentAccount.substring(0, 6) + "..." + currentAccount.substring(38);
                    lizaBtn.removeAttribute('disabled');
                    statusMessage.innerText = "Wallet connected successfully! Start tapping.";
                    
                    // Загружаем данные этого пользователя из Firebase
                    loadUserData(currentAccount);
                } catch (error) {
                    console.error(error);
                    statusMessage.innerText = "Error or rejection: " + error.message;
                }
            } else {
                statusMessage.innerText = "MetaMask not found! If you are on a phone, open this link inside the MetaMask built-in browser.";
            }
        }

        // Загрузка индивидуальных данных пользователя и глобального саплая
        function loadUserData(address) {
            // Подписка на баланс текущего пользователя
            database.ref('users/' + address).on('value', (snapshot) => {
                const data = snapshot.val();
                userBalance = data ? data.balance : 0;
                balanceDisplay.innerText = userBalance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4});
            });

            // Подписка на глобальный эмиссионный баланс
            database.ref('global/totalSupply').on('value', (snapshot) => {
                totalGlobalSupply = snapshot.val() || 0;
                supplyDisplay.innerText = totalGlobalSupply.toLocaleString(undefined, {maximumFractionDigits: 2});
                
                const currentReward = calculateReward(totalGlobalSupply);
                rewardDisplay.innerText = currentReward;
            });
        }

        // Слушатель для обновления Дашборда (список всех кошельков)
        database.ref('users').on('value', (snapshot) => {
            userList.innerHTML = '';
            const users = snapshot.val();
            if (users) {
                Object.keys(users).forEach(addr => {
                    const shortAddr = addr.substring(0, 6) + "..." + addr.substring(38);
                    const bal = users[addr].balance || 0;
                    
                    const li = document.createElement('li');
                    li.className = 'user-item';
                    li.innerHTML = `
                        <span class="user-address">${shortAddr}</span>
                        <span class="user-balance">${bal.toFixed(2)}</span>
                    `;
                    userList.appendChild(li);
                });
            } else {
                userList.innerHTML = '<li class="user-item">No active miners yet</li>';
            }
        });

        // Логика клика по кнопке LIZA
        lizaBtn.addEventListener('click', () => {
            if (!currentAccount) return;

            const reward = calculateReward(totalGlobalSupply);

            if (totalGlobalSupply + reward > MAX_SUPPLY) {
