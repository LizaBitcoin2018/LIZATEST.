<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIZA Exchange</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: #eee;
        }
        body {
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #galaxy {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center, #0a0a2a 0%, #000 70%);
            overflow: hidden;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .galaxy-arm {
            position: absolute;
            top: 50%; left: 50%;
            width: 140vmax; height: 140vmax;
            margin: -70vmax;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(100,80,255,0.08) 40deg, rgba(180,100,255,0.15) 80deg, transparent 120deg, rgba(80,150,255,0.1) 180deg, transparent 220deg, rgba(150,80,255,0.12) 280deg, transparent 360deg);
            border-radius: 50%;
            animation: rotateGalaxy 120s linear infinite;
            filter: blur(40px);
        }
        @keyframes rotateGalaxy {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(15,15,25,0.92);
            border-bottom: 2px solid #00c6ff;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #00c6ff; font-size: 1.35rem; }
        .user-info { color: #00ffcc; font-size: 0.95rem; }

        .content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 50px;
            max-width: 520px;
            margin: 0 auto;
            width: 100%;
        }

        .balance-block {
            text-align: center;
            margin-bottom: 22px;
            width: 100%;
        }
        .balance-label { color: #aaa; font-size: 0.95rem; margin-bottom: 4px; }
        .balances {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 1.35rem;
            font-weight: bold;
        }
        .bal-liza { color: #f7931a; }
        .bal-yo { color: #00c6ff; }

        .exchange-panel {
            background: rgba(15,20,40,0.95);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            border: 1px solid rgba(0,180,255,0.35);
        }
        .exchange-panel h3 {
            color: #00c6ff;
            text-align: center;
            margin-bottom: 12px;
            font-size: 1.25rem;
        }
        .price-line {
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 4px;
        }
        .liquidity-info {
            text-align: center;
            font-size: 0.84rem;
            color: #999;
            margin-bottom: 14px;
        }

        .chart-container {
            background: #0a0a15;
            border-radius: 10px;
            height: 240px;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        #priceChart {
            width: 100%;
            height: 100%;
            display: block;
        }

        .trade-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        .trade-box {
            background: rgba(0,0,0,0.35);
            border-radius: 12px;
            padding: 14px;
        }
        .trade-box h4 {
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #ccc;
        }
        .trade-box input {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid #444;
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .buy-btn, .sell-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            color: white;
        }
        .buy-btn { background: #00aa55; }
        .sell-btn { background: #cc3333; }

        .orderbook {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.82rem;
            margin-bottom: 14px;
        }
        .orderbook-side h5 {
            text-align: center;
            margin-bottom: 6px;
            font-size: 0.85rem;
        }
        .asks h5 { color: #ff5555; }
        .bids h5 { color: #00ff88; }
        .ob-row {
            display: flex;
            justify-content: space-between;
            padding: 3px 4px;
        }

        .recent-title {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 8px;
        }
        .recent-trades {
            max-height: 170px;
            overflow-y: auto;
            font-size: 0.84rem;
        }
        .trade-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #222;
        }

        #authBlock {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.96);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .auth-box {
            background: rgba(20,20,40,0.98);
            border: 1px solid #00c6ff;
            border-radius: 16px;
            padding: 30px;
            width: 340px;
            max-width: 92vw;
            text-align: center;
        }
        .auth-box h1 {
            color: #00c6ff;
            font-size: 1.7rem;
            margin-bottom: 22px;
        }
        .auth-box input {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid #555;
            color: white;
            padding: 13px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 1rem;
            outline: none;
        }
        .auth-btn {
            width: 100%;
            background: #00c6ff;
            color: #000;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
        }
        .auth-switch {
            margin-top: 18px;
            font-size: 0.9rem;
            color: #aaa;
            cursor: pointer;
        }
        .auth-switch span { color: #00aaff; text-decoration: underline; }
        .error {
            color: #ff5555;
            margin-top: 14px;
            font-size: 0.9rem;
            min-height: 20px;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="galaxy">
        <div class="galaxy-arm"></div>
    </div>

    <div id="authBlock">
        <div class="auth-box">
            <h1>LIZA Exchange</h1>
            <div id="loginForm">
                <input type="text" id="nickInput" placeholder="Никнейм" maxlength="20">
                <input type="password" id="passInput" placeholder="Пароль" maxlength="30">
                <button class="auth-btn" id="loginBtn">Войти</button>
                <div class="auth-switch" id="toRegister">Нет аккаунта? <span>Зарегистрироваться</span></div>
            </div>
            <div id="registerForm" style="display:none;">
                <input type="text" id="regNick" placeholder="Никнейм" maxlength="20">
                <input type="password" id="regPass" placeholder="Пароль" maxlength="30">
                <input type="password" id="regPass2" placeholder="Повторите пароль" maxlength="30">
                <button class="auth-btn" id="registerBtn">Создать аккаунт</button>
                <div class="auth-switch" id="toLogin">Уже есть аккаунт? <span>Войти</span></div>
            </div>
            <p id="errorText" class="error"></p>
        </div>
    </div>

    <div class="header" id="header" style="display:none;">
        <h1>LIZA Exchange</h1>
        <div class="user-info" id="userDisplay">-</div>
    </div>

    <div class="content" id="game" style="display:none;">
        <div class="balance-block">
            <div class="balance-label">Твой баланс</div>
            <div class="balances">
                <div class="bal-liza"><span id="balanceDisplay">0</span> LIZA</div>
                <div class="bal-yo"><span id="yoBalanceDisplay">0</span> YO</div>
            </div>
        </div>

        <div class="exchange-panel">
            <h3>Биржа LIZA / YO</h3>
            
            <div class="price-line">
                1 YO = <span id="currentPrice">1.0000</span> LIZA
            </div>
            <div class="liquidity-info">
                Пул: <span id="poolLiza">1 000 000</span> LIZA + <span id="poolYo">1 000 000</span> YO
            </div>

            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>

            <div class="trade-form">
                <div class="trade-box">
                    <h4>Купить YO за LIZA</h4>
                    <input type="number" id="buyAmount" placeholder="Сумма LIZA" min="1" step="any">
                    <button class="buy-btn" id="buyBtn">Купить YO</button>
                </div>
                <div class="trade-box">
                    <h4>Продать YO за LIZA</h4>
                    <input type="number" id="sellAmount" placeholder="Сумма YO" min="0.01" step="any">
                    <button class="sell-btn" id="sellBtn">Продать YO</button>
                </div>
            </div>

            <div class="orderbook">
                <div class="orderbook-side asks">
                    <h5>Продажа</h5>
                    <div id="asksList"></div>
                </div>
                <div class="orderbook-side bids">
                    <h5>Покупка</h5>
                    <div id="bidsList"></div>
                </div>
            </div>

            <div class="recent-title">Последние сделки</div>
            <div class="recent-trades" id="recentTrades"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
            authDomain: "lizatest-124da.firebaseapp.com",
            databaseURL: "https://lizatest-124da-default-rtdb.firebaseio.com",
            projectId: "lizatest-124da",
            storageBucket: "lizatest-124da.firebasestorage.app",
            messagingSenderId: "88106031938",
            appId: "1:88106031938:web:0b3b08517e71ce33aa06db"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const INITIAL_LIZA = 1000000;
        const INITIAL_YO = 1000000;

        let myNick = "";
        let myBalance = 0;
        let myYoBalance = 0;
        let poolLiza = INITIAL_LIZA;
        let poolYo = INITIAL_YO;
        let priceHistory = [];
        let recentTrades = [];

        // Звёзды
        const galaxy = document.getElementById('galaxy');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2 + 0.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
            galaxy.appendChild(star);
        }

        // Авторизация
        const errorText = document.getElementById('errorText');
        document.getElementById('toRegister').onclick = () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            errorText.innerText = '';
        };
        document.getElementById('toLogin').onclick = () => {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            errorText.innerText = '';
        };

        document.getElementById('loginBtn').onclick = doLogin;
        document.getElementById('passInput').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
        document.getElementById('registerBtn').onclick = doRegister;
        document.getElementById('regPass2').onkeydown = e => { if (e.key === 'Enter') doRegister(); };

        function doLogin() {
            const nick = document.getElementById('nickInput').value.trim().toLowerCase();
            const pass = document.getElementById('passInput').value;
            if (!nick || !pass) return errorText.innerText = "Заполни все поля";

            errorText.innerText = "Проверяем...";
            db.ref('users/' + nick).once('value').then(snap => {
                if (!snap.exists()) return errorText.innerText = "Пользователь не найден";
                const data = snap.val();
                if (data.password !== pass) return errorText.innerText = "Неверный пароль";
                startGame(nick, data);
            }).catch(() => errorText.innerText = "Ошибка соединения");
        }

        function doRegister() {
            const nick = document.getElementById('regNick').value.trim().toLowerCase();
            const pass = document.getElementById('regPass').value;
            const pass2 = document.getElementById('regPass2').value;

            if (!nick || nick.length < 3) return errorText.innerText = "Ник минимум 3 символа";
            if (!/^[a-z0-9_]+$/.test(nick)) return errorText.innerText = "Только латиница, цифры и _";
            if (!pass || pass.length < 4) return errorText.innerText = "Пароль минимум 4 символа";
            if (pass !== pass2) return errorText.innerText = "Пароли не совпадают";

            errorText.innerText = "Создаём...";
            db.ref('users/' + nick).once('value').then(snap => {
                if (snap.exists()) return errorText.innerText = "Ник занят";
                const data = { password: pass, balance: 50000, yoBalance: 1000 };
                return db.ref('users/' + nick).set(data).then(() => startGame(nick, data));
            }).catch(() => errorText.innerText = "Ошибка");
        }

        function startGame(nick, data) {
            myNick = nick;
            myBalance = Number(data.balance) || 0;
            myYoBalance = Number(data.yoBalance) || 0;

            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('header').style.display = 'flex';
            document.getElementById('game').style.display = 'flex';
            document.getElementById('userDisplay').innerText = myNick;

            // Загружаем пул один раз + слушаем
            db.ref('exchange/pool').on('value', snap => {
                const d = snap.val();
                if (d) {
                    poolLiza = Number(d.liza) || poolLiza;
                    poolYo = Number(d.yo) || poolYo;
                } else {
                    db.ref('exchange/pool').set({ liza: INITIAL_LIZA, yo: INITIAL_YO });
                }
                updateExchangeUI();
            });

            // Загружаем историю цен
            db.ref('exchange/priceHistory').limitToLast(60).once('value').then(snap => {
                const val = snap.val() || {};
                priceHistory = Object.values(val).sort((a, b) => a.t - b.t);
                if (priceHistory.length < 2) {
                    const p = 1.0;
                    const now = Date.now();
                    priceHistory = [
                        {p: p*0.99, t: now-30000},
                        {p: p*1.01, t: now-20000},
                        {p: p*0.995, t: now-10000},
                        {p: p, t: now}
                    ];
                }
                drawChart();
            });

            // Слушаем новые точки цены
            db.ref('exchange/priceHistory').limitToLast(1).on('child_added', snap => {
                const point = snap.val();
                if (!point) return;
                // Добавляем только если это действительно новая точка
                if (priceHistory.length === 0 || point.t > priceHistory[priceHistory.length-1].t) {
                    priceHistory.push(point);
                    if (priceHistory.length > 60) priceHistory.shift();
                    drawChart();
                }
            });

            // История сделок
            db.ref('exchange/trades').limitToLast(20).on('value', snap => {
                const val = snap.val() || {};
                recentTrades = Object.values(val).sort((a, b) => b.t - a.t);
                renderRecentTrades();
            });

            updateUI();
            document.getElementById('buyBtn').onclick = buyYO;
            document.getElementById('sellBtn').onclick = sellYO;
        }

        function getPrice() {
            return poolYo > 0 ? poolLiza / poolYo : 1;
        }

        function updateExchangeUI() {
            const price = getPrice();
            document.getElementById('currentPrice').innerText = price.toFixed(4);
            document.getElementById('poolLiza').innerText = Math.floor(poolLiza).toLocaleString('ru');
            document.getElementById('poolYo').innerText = Math.floor(poolYo).toLocaleString('ru');
            renderOrderBook(price);
        }

        function renderOrderBook(price) {
            let asks = '', bids = '';
            for (let i = 1; i <= 6; i++) {
                asks += `<div class="ob-row"><span style="color:#ff6666">${(price*(1+i*0.007)).toFixed(4)}</span><span>${(1800+i*600).toLocaleString('ru')}</span></div>`;
                bids += `<div class="ob-row"><span style="color:#66ff99">${(price*(1-i*0.007)).toFixed(4)}</span><span>${(1800+i*600).toLocaleString('ru')}</span></div>`;
            }
            document.getElementById('asksList').innerHTML = asks;
            document.getElementById('bidsList').innerHTML = bids;
        }

        function buyYO() {
            const lizaIn = parseFloat(document.getElementById('buyAmount').value);
            if (isNaN(lizaIn) || lizaIn <= 0) return alert("Введите сумму LIZA");
            if (lizaIn > myBalance) return alert("Недостаточно LIZA");

            const k = poolLiza * poolYo;
            const newLiza = poolLiza + lizaIn;
            const newYo = k / newLiza;
            const yoOut = poolYo - newYo;
            if (yoOut <= 0) return alert("Слишком маленькая сумма");

            // Локально обновляем
            myBalance -= lizaIn;
            myYoBalance += yoOut;
            poolLiza = newLiza;
            poolYo = newYo;

            const price = getPrice();
            const now = Date.now();
            const point = { p: price, t: now };
            const trade = { type: 'buy', amount: yoOut, price, user: myNick, t: now };

            // Сразу в график и историю
            priceHistory.push(point);
            if (priceHistory.length > 60) priceHistory.shift();
            recentTrades.unshift(trade);
            if (recentTrades.length > 20) recentTrades.pop();

            updateUI();
            updateExchangeUI();
            drawChart();
            renderRecentTrades();

            // Отправляем в Firebase
            db.ref('users/' + myNick).update({ balance: myBalance, yoBalance: myYoBalance });
            db.ref('exchange/pool').set({ liza: poolLiza, yo: poolYo });
            db.ref('exchange/priceHistory').push(point);
            db.ref('exchange/trades').push(trade);

            document.getElementById('buyAmount').value = '';
        }

        function sellYO() {
            const yoIn = parseFloat(document.getElementById('sellAmount').value);
            if (isNaN(yoIn) || yoIn <= 0) return alert("Введите сумму YO");
            if (yoIn > myYoBalance) return alert("Недостаточно YO");

            const k = poolLiza * poolYo;
            const newYo = poolYo + yoIn;
            const newLiza = k / newYo;
            const lizaOut = poolLiza - newLiza;
            if (lizaOut <= 0) return alert("Слишком маленькая сумма");

            myYoBalance -= yoIn;
            myBalance += lizaOut;
            poolYo = newYo;
            poolLiza = newLiza;

            const price = getPrice();
            const now = Date.now();
            const point = { p: price, t: now };
            const trade = { type: 'sell', amount: yoIn, price, user: myNick, t: now };

            priceHistory.push(point);
            if (priceHistory.length > 60) priceHistory.shift();
            recentTrades.unshift(trade);
            if (recentTrades.length > 20) recentTrades.pop();

            updateUI();
            updateExchangeUI();
            drawChart();
            renderRecentTrades();

            db.ref('users/' + myNick).update({ balance: myBalance, yoBalance: myYoBalance });
            db.ref('exchange/pool').set({ liza: poolLiza, yo: poolYo });
            db.ref('exchange/priceHistory').push(point);
            db.ref('exchange/trades').push(trade);

            document.getElementById('sellAmount').value = '';
        }

        function renderRecentTrades() {
            const box = document.getElementById('recentTrades');
            if (!recentTrades.length) {
                box.innerHTML = '<div style="color:#666;text-align:center;padding:12px;">Пока нет сделок</div>';
                return;
            }
            box.innerHTML = recentTrades.map(t => `
                <div class="trade-item">
                    <span style="color:${t.type==='buy' ? '#00ff88' : '#ff5555'}">${t.type==='buy'?'BUY':'SELL'} ${Number(t.amount).toFixed(2)}</span>
                    <span>${Number(t.price).toFixed(4)}</span>
                    <span style="color:#888">${t.user}</span>
                </div>
            `).join('');
        }

        function drawChart() {
            const canvas = document.getElementById('priceChart');
            if (!canvas) return;

            const container = canvas.parentElement;
            const w = container.clientWidth;
            const h = container.clientHeight;
            if (w < 50 || h < 50) return;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';

            const ctx = canvas.getContext('2d');
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            // Фон
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, w, h);

            if (priceHistory.length < 2) {
                ctx.fillStyle = '#666';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Сделайте сделку', w/2, h/2);
                return;
            }

            // Свечи
            const candles = [];
            for (let i = 1; i < priceHistory.length; i++) {
                const open = priceHistory[i-1].p;
                const close = priceHistory[i].p;
                candles.push({
                    open,
                    close,
                    high: Math.max(open, close) * 1.003,
                    low: Math.min(open, close) * 0.997
                });
            }

            const visible = candles.slice(-35);
            if (!visible.length) return;

            let minP = Math.min(...visible.map(c => c.low));
            let maxP = Math.max(...visible.map(c => c.high));
            const pad = (maxP - minP) * 0.18 || 0.01;
            minP -= pad;
            maxP += pad;
            const range = maxP - minP;

            // Сетка
            ctx.strokeStyle = 'rgba(255,255,255,0.08)';
            ctx.fillStyle = 'rgba(255,255,255,0.45)';
            ctx.font = '11px monospace';
            ctx.textAlign = 'left';
            ctx.lineWidth = 1;

            for (let i = 0; i <= 4; i++) {
                const y = 22 + (i/4)*(h-45);
                const price = maxP - (i/4)*range;
                ctx.beginPath();
                ctx.moveTo(48, y);
                ctx.lineTo(w-8, y);
                ctx.stroke();
                ctx.fillText(price.toFixed(4), 4, y+3);
            }

            // Свечи
            const cw = Math.max(5, (w - 65) / visible.length - 2.2);

            visible.forEach((c, i) => {
                const x = 52 + i * (cw + 2.2);
                const yH = 22 + ((maxP - c.high)/range)*(h-45);
                const yL = 22 + ((maxP - c.low)/range)*(h-45);
                const yO = 22 + ((maxP - c.open)/range)*(h-45);
                const yC = 22 + ((maxP - c.close)/range)*(h-45);

                const green = c.close >= c.open;
                const col = green ? '#00c853' : '#ff1744';

                // Тень
                ctx.beginPath();
                ctx.strokeStyle = col;
                ctx.lineWidth = 1.4;
                ctx.moveTo(x + cw/2, yH);
                ctx.lineTo(x + cw/2, yL);
                ctx.stroke();

                // Тело
                const top = Math.min(yO, yC);
                const height = Math.max(2, Math.abs(yC - yO));
                ctx.fillStyle = col;
                ctx.fillRect(x, top, cw, height);
            });

            // Последняя цена
            const last = visible[visible.length-1].close;
            ctx.fillStyle = '#00ff88';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(last.toFixed(4), w-10, 16);
        }

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = Math.floor(myBalance).toLocaleString('ru');
            document.getElementById('yoBalanceDisplay').innerText = myYoBalance.toLocaleString('ru', {maximumFractionDigits: 4});
        }

        window.addEventListener('resize', () => setTimeout(drawChart, 150));
    </script>
</body>
</html>
