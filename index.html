<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIZABITCOIN</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            min-height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: #000;
            color: #eee;
        }
        body {
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #galaxy {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center, #0a0a2a 0%, #000 70%);
            overflow: hidden;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .galaxy-arm {
            position: absolute;
            top: 50%; left: 50%;
            width: 140vmax; height: 140vmax;
            margin: -70vmax;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(100,80,255,0.08) 40deg, rgba(180,100,255,0.15) 80deg, transparent 120deg, rgba(80,150,255,0.1) 180deg, transparent 220deg, rgba(150,80,255,0.12) 280deg, transparent 360deg);
            border-radius: 50%;
            animation: rotateGalaxy 120s linear infinite;
            filter: blur(40px);
        }
        @keyframes rotateGalaxy {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .nebula {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.25;
            animation: pulse 15s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.2; }
            50% { transform: scale(1.2); opacity: 0.35; }
        }

        .fairy {
            position: fixed;
            font-size: 26px;
            z-index: 5;
            pointer-events: none;
            filter: drop-shadow(0 0 8px rgba(255,150,255,0.8));
            animation: fairyFly 25s linear infinite;
        }
        @keyframes fairyFly {
            0%   { transform: translate(5vw, 80vh) rotate(10deg); }
            20%  { transform: translate(30vw, 20vh) rotate(-15deg); }
            40%  { transform: translate(70vw, 60vh) rotate(20deg); }
            60%  { transform: translate(85vw, 15vh) rotate(-10deg); }
            80%  { transform: translate(40vw, 75vh) rotate(15deg); }
            100% { transform: translate(5vw, 80vh) rotate(10deg); }
        }

        .btc-coin {
            position: fixed;
            font-size: 30px;
            z-index: 50;
            cursor: pointer;
            user-select: none;
            pointer-events: auto;
            filter: drop-shadow(0 0 10px gold);
            transition: transform 0.15s;
            animation: coinFloat 3s ease-in-out infinite;
        }
        .btc-coin:hover {
            transform: scale(1.4) !important;
            filter: drop-shadow(0 0 16px #ff0);
        }
        @keyframes coinFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-16px) rotate(12deg); }
        }
        .coin-explode {
            animation: explode 0.45s forwards !important;
            pointer-events: none;
        }
        @keyframes explode {
            0%   { transform: scale(1); opacity: 1; }
            100% { transform: scale(2.8); opacity: 0; }
        }

        .waifu {
            position: fixed;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            z-index: 8;
            pointer-events: none;
            filter: drop-shadow(0 0 14px rgba(255,120,180,0.8));
            animation: waifuDance 1.1s ease-in-out infinite;
        }
        @keyframes waifuDance {
            0%   { transform: translateX(-50%) translateY(0) rotate(-8deg); }
            25%  { transform: translateX(-50%) translateY(-12px) rotate(8deg); }
            50%  { transform: translateX(-50%) translateY(0) rotate(-8deg); }
            75%  { transform: translateX(-50%) translateY(-12px) rotate(8deg); }
            100% { transform: translateX(-50%) translateY(0) rotate(-8deg); }
        }

        .header {
            position: relative;
            z-index: 10;
            background: rgba(15,15,25,0.92);
            border-bottom: 2px solid #f7931a;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header h1 { color: #f7931a; font-size: 1.3rem; }
        .user-info { color: #00ffcc; font-size: 0.95rem; }

        .content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 50px;
            max-width: 520px;
            margin: 0 auto;
            width: 100%;
        }

        .balance-block {
            text-align: center;
            margin-bottom: 8px;
        }
        .balance-label {
            color: #aaa;
            font-size: 0.95rem;
        }
        .balance {
            font-size: 2.3rem;
            font-weight: bold;
            color: #f7931a;
            text-shadow: 0 0 20px rgba(247,147,26,0.45);
            word-break: break-all;
        }
        .rank {
            font-size: 0.95rem;
            color: #00d4ff;
            margin-top: 4px;
        }
        .next-rank {
            font-size: 0.8rem;
            color: #88aaff;
            margin-bottom: 20px;
        }

        /* Круглая YO (чуть больше) */
        .yo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0 28px;
        }
        .yo-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(145deg, #00c6ff, #0072ff);
            border: none;
            color: white;
            font-weight: bold;
            font-size: 2.6rem;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(0,150,255,0.7), inset 0 0 20px rgba(255,255,255,0.15);
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        .yo-btn:active {
            transform: scale(0.93);
        }
        .yo-info {
            font-size: 0.9rem;
            color: #88ccff;
            text-align: center;
            margin-top: 12px;
            line-height: 1.4;
        }

        /* Dice */
        .dice-panel {
            background: rgba(20,20,40,0.9);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            margin-bottom: 20px;
            border: 1px solid rgba(0,150,255,0.35);
        }
        .dice-panel h4 {
            color: #00aaff;
            margin-bottom: 8px;
            font-size: 1.1rem;
            text-align: center;
        }
        .dice-bank {
            text-align: center;
            font-size: 0.9rem;
            color: #ffcc00;
            margin-bottom: 10px;
        }
        #diceBet {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid #444;
            color: white;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 10px;
        }
        .dice-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .dice-btn {
            padding: 12px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            color: white;
        }
        .dice-btn.low { background: linear-gradient(90deg, #0066ff, #0099ff); }
        .dice-btn.high { background: linear-gradient(90deg, #0066ff, #00ccff); }
        .dice-result {
            text-align: center;
            font-size: 1.05rem;
            min-height: 26px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .dice-history {
            max-height: 100px;
            overflow-y: auto;
            font-size: 0.82rem;
        }
        .dice-history-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid #2a2a3a;
        }
        .win { color: #00ff88; }
        .lose { color: #ff5555; }

        .yobit-btn {
            display: block;
            width: 100%;
            padding: 13px;
            background: linear-gradient(90deg, #f7931a, #ffb347);
            border: none;
            border-radius: 10px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            margin-bottom: 24px;
        }

        .bottom-stats {
            width: 100%;
            background: rgba(15,15,30,0.9);
            border-radius: 12px;
            border: 1px solid rgba(100,100,255,0.2);
            overflow: hidden;
            margin-top: 10px;
        }
        .bottom-stats h3 {
            color: #f7931a;
            padding: 12px 16px;
            font-size: 1.05rem;
            border-bottom: 1px solid #333;
        }
        .lb-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 16px;
            font-size: 0.9rem;
            border-bottom: 1px solid #2a2a2a;
        }
        .lb-item:last-child { border-bottom: none; }
        .lb-rank { color: #888; width: 24px; }
        .lb-addr { color: #00ffcc; }
        .lb-bal { font-weight: bold; }

        #authBlock {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .auth-box {
            background: rgba(20,20,40,0.98);
            border: 1px solid #f7931a;
            border-radius: 14px;
            padding: 28px 30px;
            width: 340px;
            max-width: 92vw;
            text-align: center;
        }
        .auth-box h1 {
            color: #f7931a;
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .auth-box input {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid #555;
            color: white;
            padding: 12px 14px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 1rem;
            outline: none;
        }
        .auth-box input:focus { border-color: #f7931a; }
        .auth-btn {
            width: 100%;
            background: #f7931a;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            margin-top: 4px;
        }
        .auth-btn:hover { background: #e07b00; }
        .auth-switch {
            margin-top: 16px;
            font-size: 0.9rem;
            color: #aaa;
            cursor: pointer;
        }
        .auth-switch span { color: #00aaff; text-decoration: underline; }
        .error {
            color: #ff5555;
            margin-top: 12px;
            font-size: 0.9rem;
            min-height: 20px;
        }

        .float-plus-big {
            position: fixed;
            color: gold;
            font-weight: bold;
            font-size: 1.7rem;
            pointer-events: none;
            animation: floatUpBig 1.3s ease-out forwards;
            text-shadow: 0 0 14px rgba(255,215,0,0.9);
            z-index: 60;
        }
        @keyframes floatUpBig {
            0%   { opacity: 1; transform: translateY(0) scale(1); }
            60%  { opacity: 1; transform: translateY(-40px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-70px) scale(1); }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="galaxy">
        <div class="galaxy-arm"></div>
        <div class="nebula" style="width:400px;height:400px;background:#5a20ff;top:10%;left:15%;"></div>
        <div class="nebula" style="width:500px;height:300px;background:#2040ff;top:60%;left:60%;animation-delay:5s;"></div>

    <div class="fairy">🧚‍♀️</div>

    <!-- Авторизация -->
    <div id="authBlock">
        <div class="auth-box">
            <h1>LIZABITCOIN</h1>
            <div id="loginForm">
                <input type="text" id="nickInput" placeholder="Никнейм" maxlength="20">

    <!-- Игра -->
    <div class="header" id="header" style="display:none;">
        <h1>LIZABITCOIN</h1>
        <div class="user-info" id="userDisplay">-</div>
    </div>

    <div class="content" id="game" style="display:none;">
        <div class="balance-block">
            <div class="balance-label">Твой баланс</div>
            <div class="balance"><span id="balanceDisplay">0</span> LIZA</div>
            <div class="rank" id="rankDisplay">Ранг: Новичок</div>

        <!-- Dice -->
        <div class="dice-panel">
            <h4>DICE — Удвой LIZA</h4>

        <a href="https://yobit.net/ru/trade/LIZA/RUR/?bonus=lZgQG" target="_blank" class="yobit-btn">

        </a>

        <div class="bottom-stats">
            <h3>Топ игроков</h3>
            <div id="leaderboardList"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
            authDomain: "lizatest-124da.firebaseapp.com",
            databaseURL: "https://lizatest-124da-default-rtdb.firebaseio.com",
            projectId: "lizatest-124da",
            storageBucket: "lizatest-124da.firebasestorage.app",
            messagingSenderId: "88106031938",
            appId: "1:88106031938:web:0b3b08517e71ce33aa06db",
            measurementId: "G-HT8D6XRFSY"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const MAX_BALANCE = 9223372036854775807n;
        const COIN_REWARD = 250000;
        const START_BANK = 100000000000000;

        let myNick = "";
        let myBalance = 0;
        let yoClicks = 0;
        let diceBank = START_BANK;
        let diceHistory = [];

        const RANKS = [
            { min: 0, title: "Новичок" },
            { min: 10000, title: "Квантовая Пылинка" },
            { min: 100000, title: "Атомный Странник" },
            { min: 1000000, title: "Протонный Майнер" },
            { min: 10000000, title: "Нейтронная Звезда" },
            { min: 100000000, title: "Чёрная Дыра" },
            { min: 1000000000, title: "Галактический Коллектор" },
            { min: 10000000000, title: "Квазар" },
            { min: 100000000000, title: "Сверхновое Ядро" },
            { min: 1e12, title: "Большой Взрыв" },
            { min: 1e13, title: "Мультивселенная" },
            { min: 1e14, title: "Абсолютный Ноль" },
            { min: 1e15, title: "Божественная Частица" },
            { min: 1e16, title: "Создатель Реальности" }
        ];

        // Звёзды
        const galaxy = document.getElementById('galaxy');
        for (let i = 0; i < 130; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.2 + 0.4;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.setProperty('--dur', (Math.random() * 4 + 2) + 's');
            star.style.animationDelay = (Math.random() * 5) + 's';
            galaxy.appendChild(star);
        }

        // ===== Авторизация =====
        const errorText = document.getElementById('errorText');

        document.getElementById('toRegister').onclick = () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            errorText.innerText = '';
        };
        document.getElementById('toLogin').onclick = () => {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            errorText.innerText = '';
        };

        document.getElementById('loginBtn').onclick = doLogin;
        document.getElementById('passInput').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
        document.getElementById('registerBtn').onclick = doRegister;
        document.getElementById('regPass2').onkeydown = e => { if (e.key === 'Enter') doRegister(); };

        function doLogin() {
            const nick = document.getElementById('nickInput').value.trim().toLowerCase();
            const pass = document.getElementById('passInput').value;
            if (!nick || !pass) return errorText.innerText = "Заполни все поля";

            errorText.innerText = "Проверяем...";
            db.ref('users/' + nick).once('value').then(snap => {
                if (!snap.exists()) return errorText.innerText = "Пользователь не найден";
                const data = snap.val();
                if (data.password !== pass) return errorText.innerText = "Неверный пароль";
                startGame(nick, data);
            }).catch(() => errorText.innerText = "Ошибка соединения");
        }

        function doRegister() {
            const nick = document.getElementById('regNick').value.trim().toLowerCase();
            const pass = document.getElementById('regPass').value;
            const pass2 = document.getElementById('regPass2').value;

            if (!nick || nick.length < 3) return errorText.innerText = "Ник минимум 3 символа";
            if (!/^[a-z0-9_]+$/.test(nick)) return errorText.innerText = "Только латиница, цифры и _";
            if (!pass || pass.length < 4) return errorText.innerText = "Пароль минимум 4 символа";
            if (pass !== pass2) return errorText.innerText = "Пароли не совпадают";

            errorText.innerText = "Создаём аккаунт...";
            db.ref('users/' + nick).once('value').then(snap => {
                if (snap.exists()) return errorText.innerText = "Такой ник уже занят";

                const data = { password: pass, balance: 0 };
                return db.ref('users/' + nick).set(data).then(() => startGame(nick, data));
            }).catch(err => errorText.innerText = "Ошибка: " + (err.message || "неизвестно"));
        }

        function startGame(nick, data) {
            myNick = nick;
            myBalance = data.balance || 0;

            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('header').style.display = 'flex';
            document.getElementById('game').style.display = 'flex';
            document.getElementById('userDisplay').innerText = myNick;

            db.ref('global/diceBank').on('value', snap => {
                const val = snap.val();
                if (val === null || val === undefined) {
                    db.ref('global/diceBank').set(START_BANK);
                    diceBank = START_BANK;
                } else diceBank = val;
                document.getElementById('diceBank').innerText = Math.floor(diceBank).toLocaleString('ru');
            });

            db.ref('users').on('value', snap => renderLeaderboard(snap.val()));

            updateUI();

            document.getElementById('yoBtn').onclick = clickYO;
            document.getElementById('diceLow').onclick = () => playDice('low');
            document.getElementById('diceHigh').onclick = () => playDice('high');
        }

        function getRankInfo(balance) {
            let current = RANKS[0], next = RANKS[1] || null;
            for (let i = 0; i < RANKS.length; i++) {
                if (balance >= RANKS[i].min) {
                    current = RANKS[i];
                    next = RANKS[i + 1] || null;
                }
            }
            return { current, next };
        }

        function updateRank() {
            const info = getRankInfo(myBalance);
            document.getElementById('rankDisplay').innerText = "Ранг: " + info.current.title;
            document.getElementById('nextRankDisplay').innerText = info.next
                ? "Следующий: " + info.next.title + " (" + info.next.min.toLocaleString('ru') + ")"
                : "Максимальный ранг";
        }

        function playCoinSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = "sine";
                osc.frequency.setValueAtTime(1200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
                osc.start();
                osc.stop(ctx.currentTime + 0.12);
            } catch(e) {}
        }

        function showBigPlus(x, y, amount) {
            const plus = document.createElement('div');
            plus.className = 'float-plus-big';
            plus.innerText = `+${amount.toLocaleString('ru')}`;
            plus.style.left = (x - 40) + 'px';
            plus.style.top = (y - 20) + 'px';
            document.body.appendChild(plus);
            setTimeout(() => plus.remove(), 1300);
        }

        // Монетки (в 5 раз больше)
        function spawnCoin() {
            const coin = document.createElement('div');
            coin.className = 'btc-coin';
            coin.innerHTML = '₿';
            coin.style.left = (Math.random() * 85 + 5) + 'vw';
            coin.style.top = (Math.random() * 70 + 8) + 'vh';
            coin.onclick = function(e) {
                if (!myNick) return;
                coin.classList.add('coin-explode');
                playCoinSound();
                showBigPlus(e.clientX, e.clientY, COIN_REWARD);
                myBalance = Math.min(Number(MAX_BALANCE), myBalance + COIN_REWARD);
                saveUser();
                updateUI();
                setTimeout(() => coin.remove(), 450);
            };
            document.body.appendChild(coin);
            setTimeout(() => { if (coin.parentNode && !coin.classList.contains('coin-explode')) coin.remove(); }, 12000 + Math.random()*5000);
        }
        // Спавним чаще и больше
        setInterval(spawnCoin, 400);          // каждые 0.4 сек
        setTimeout(() => { for(let i=0;i<12;i++) spawnCoin(); }, 600);

        // YO — каждый 10-й клик 1.7M
        function clickYO() {
            yoClicks++;
            let add = 17000;
            if (yoClicks % 10 === 0) add = 1700000;

            myBalance = Math.min(Number(MAX_BALANCE), myBalance + add);
            saveUser();
            updateUI();
            playCoinSound();
        }

        function playDice(direction) {
            if (!myNick) return;
            const bet = parseFloat(document.getElementById('diceBet').value);
            if (isNaN(bet) || bet <= 0) return alert("Введите ставку");
            if (bet > myBalance) return alert("Недостаточно LIZA");
            if (bet > diceBank) return alert("В банке мало средств");

            const roll = Math.random() * 100;
            const rollFixed = roll.toFixed(3);
            const win = (direction === 'low' && roll < 48) || (direction === 'high' && roll > 52);
            const resultEl = document.getElementById('diceResult');

            if (win) {
                myBalance += bet;
                db.ref('global/diceBank').transaction(cur => Math.max(0, (cur ?? START_BANK) - bet))
                    .then(res => { if (res.committed) { diceBank = res.snapshot.val(); document.getElementById('diceBank').innerText = Math.floor(diceBank).toLocaleString('ru'); }});
                resultEl.innerHTML = `<span class="win">ВЫИГРЫШ! ${rollFixed} → +${bet.toLocaleString('ru')}</span>`;
                playCoinSound();
            } else {
                myBalance -= bet;
                db.ref('global/diceBank').transaction(cur => (cur ?? START_BANK) + bet)
                    .then(res => { if (res.committed) { diceBank = res.snapshot.val(); document.getElementById('diceBank').innerText = Math.floor(diceBank).toLocaleString('ru'); }});
                resultEl.innerHTML = `<span class="lose">ПРОИГРЫШ ${rollFixed} → -${bet.toLocaleString('ru')}</span>`;
            }

            diceHistory.unshift({ roll: rollFixed, dir: direction === 'low' ? '<48' : '>52', bet, win });
            if (diceHistory.length > 10) diceHistory.pop();
            renderDiceHistory();
            saveUser();
            updateUI();
        }

        function renderDiceHistory() {
            document.getElementById('diceHistory').innerHTML = diceHistory.map(h => `
                <div class="dice-history-item">
                    <span>${h.dir} → ${h.roll}</span>
                    <span class="${h.win ? 'win' : 'lose'}">${h.win ? '+' : '-'}${h.bet.toLocaleString('ru')}</span>
                </div>
            `).join('');
        }

        function saveUser() {
            db.ref('users/' + myNick).update({ balance: myBalance });
        }

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = myBalance.toLocaleString('ru');
            updateRank();
        }

        function renderLeaderboard(users) {
            const box = document.getElementById('leaderboardList');
            if (!users) {
                box.innerHTML = '<div style="padding:12px;color:#666;text-align:center;">Пока никого нет</div>';
                return;
            }
            const sorted = Object.entries(users)
                .map(([nick, data]) => ({ nick, balance: data.balance || 0 }))
                .sort((a,b) => b.balance - a.balance)
                .slice(0, 15);

            box.innerHTML = sorted.map((u,i) => `
                <div class="lb-item">
                    <span><span class="lb-rank">${i+1}.</span> <span class="lb-addr">${u.nick}</span></span>
                    <span class="lb-bal">${u.balance.toLocaleString('ru')}</span>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
