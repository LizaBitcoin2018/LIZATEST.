<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIZABITCOIN</title>
    <script src="https://cloudflare.com"></script>
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0c1b;
            color: #ffffff;
            margin: 0;
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
        }
        .main-layout {
            display: flex;
            max-width: 850px;
            width: 100%;
            gap: 30px;
            flex-wrap: wrap;
        }
        .container {
            flex: 1;
            min-width: 350px;
            background: linear-gradient(145deg, #1d1836, #141126);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }
        .sidebar {
            width: 320px;
            background: rgba(255, 255, 255, 0.03);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        #title {
            font-size: 32px;
            color: #00ffcc;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .label {
            font-size: 14px;
            color: #a09cb0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .value {
            font-size: 32px;
            font-weight: bold;
        }
        #reward-info {
            font-size: 14px;
            color: #ff007f;
            margin-bottom: 20px;
            font-weight: bold;
        }
        #connect-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            transition: background 0.2s;
        }
        #connect-btn:hover { background-color: #2563eb; }
        #click-btn {
            background: linear-gradient(135deg, #00ffcc, #ff007f);
            color: #ffffff;
            border: none;
            padding: 25px 0;
            width: 100%;
            font-size: 26px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.05s, box-shadow 0.2s;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            margin: 10px 0;
        }
        #click-btn:active { transform: scale(0.97); }
        #click-btn:disabled {
            background: #333344;
            box-shadow: none;
            cursor: not-allowed;
            color: #666677;
        }
        .sidebar-title {
            font-size: 18px;
            font-weight: bold;
            color: #ff007f;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }
        .wallet-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 350px;
            overflow-y: auto;
        }
        .wallet-item {
            display: flex;
            justify-content: space-between;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-family: monospace;
            font-size: 13px;
        }
        .wallet-coins {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <div class="container">
            <div id="title">LIZABITCOIN</div>
            <button id="connect-btn">Connect MetaMask</button>
            
            <div class="stat-box">
                <div class="label">Total Mined Supply</div>
                <div id="global-supply" class="value">0 / 21,000,000</div>
            </div>

            <div class="stat-box">
                <div class="label">Balance (LIZA)</div>
                <div id="user-balance" class="value">0</div>
            </div>

            <div id="reward-info">Current Reward: +50 per click</div>
            <button id="click-btn" disabled>LIZA</button>
        </div>

        <div class="sidebar">
            <div class="sidebar-title">Connected Wallets</div>
            <ul id="wallet-list" class="wallet-list">
                <li style="color: #a09cb0; font-size: 14px;">Loading leaderboard...</li>
            </ul>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
            authDomain: "://firebaseapp.com",
            projectId: "lizatest-124da",
            storageBucket: "lizatest-124da.firebasestorage.app",
            messagingSenderId: "88106031938",
            appId: "1:88106031938:web:0b3b08517e71ce33aa06db",
            measurementId: "G-HT8D6XRFSY"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let userAddress = null;
        let stats = {};
        let totalMinedGlobal = 0;

        const MAX_SUPPLY = 21000000;
        const HALVING_INTERVAL = 210000; 

        const connectBtn = document.getElementById('connect-btn');
        const clickBtn = document.getElementById('click-btn');
        const balanceDiv = document.getElementById('user-balance');
        const supplyDiv = document.getElementById('global-supply');
        const rewardDiv = document.getElementById('reward-info');
        const walletListUl = document.getElementById('wallet-list');

        database.ref('game_state').on('value', (snapshot) => {
            const data = snapshot.val() || {};
            stats = data.players || {};
            totalMinedGlobal = data.total_mined || 0;
            updateUI();
        });

        function getCurrentReward() {
            let totalClicksInGame = 0;
            Object.keys(stats).forEach(addr => {
                totalClicksInGame += (stats[addr].clicks || 0);
            });

            let halvings = Math.floor(totalClicksInGame / HALVING_INTERVAL);
            let reward = 50 / Math.pow(2, halvings);
            
            return reward > 0 ? reward : 0;
        }

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    // ИСПРАВЛЕНО: берем первый адрес из массива и корректно переводим в нижний регистр
                    userAddress = accounts[0].toLowerCase();
                    
                    connectBtn.innerText = userAddress.substring(0, 6) + '...' + userAddress.substring(userAddress.length - 4);
                    connectBtn.style.backgroundColor = '#10b981';
                    
                    if (totalMinedGlobal < MAX_SUPPLY) {
                        clickBtn.disabled = false;
                    }
                    
                    if (!stats[userAddress]) {
                        database.ref('game_state/players/' + userAddress).set({
                            balance: 0,
                            clicks: 0
                        });
                    }
                    
                    updateUI();
                } catch (error) {
                    console.error("Wallet connection failed", error);
                }
            } else {
                alert('Please install MetaMask!');
            }
        }

        function updateUI() {
            const currentReward = getCurrentReward();
            supplyDiv.innerText = `${Math.floor(totalMinedGlobal).toLocaleString('en-US')} / ${MAX_SUPPLY.toLocaleString('en-US')}`;

            if (totalMinedGlobal >= MAX_SUPPLY) {
                rewardDiv.innerText = "Emission Limit Reached!";
                clickBtn.disabled = true;
                clickBtn.innerText = "MAXED OUT";
            } else {
                rewardDiv.innerText = `Current Reward: +${currentReward} LIZA per click`;
            }

            if (userAddress && stats[userAddress]) {
                balanceDiv.innerText = stats[userAddress].balance.toLocaleString('en-US', { maximumFractionDigits: 4 });
            } else {
                balanceDiv.innerText = '0';
            }

            walletListUl.innerHTML = '';
            const addresses = Object.keys(stats);

            if (addresses.length === 0) {
                walletListUl.innerHTML = '<li style="color: #a09cb0; font-size: 14px;">No wallets connected yet</li>';
                return;
            }

            addresses.sort((a, b) => stats[b].balance - stats[a].balance);

            addresses.forEach(addr => {
                const li = document.createElement('li');
                li.className = 'wallet-item';
                const shortAddr = addr.substring(0, 6) + '...' + addr.substring(addr.length - 4);
                
                li.innerHTML = `
                    <span>${shortAddr}</span>
