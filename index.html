<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>LIZABITCOIN - Mining</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%;
            overflow: hidden;          /* Главное: страница больше не скроллится */
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #eee;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .header {
            background: #1a1a1a;
            border-bottom: 2px solid #f7931a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            height: 48px;
        }
        .header h1 {
            color: #f7931a;
            font-size: 1.3rem;
        }
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            overflow: hidden;          /* Важно */
            height: calc(100vh - 48px);
        }

        /* ===== ЛЕВАЯ ПАНЕЛЬ ===== */
        .left-panel {
            background: #1a1a1a;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .left-panel h3 {
            color: #f7931a;
            padding: 12px 14px 8px;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .buy-section {
            background: #252525;
            margin: 0 12px 10px;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            flex-shrink: 0;
        }
        .buy-section div {
            font-size: 0.9rem;
        }
        .buy-btn {
            background: #f7931a;
            color: white;
            border: none;
            padding: 9px 0;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            margin-top: 7px;
            transition: 0.2s;
        }
        .buy-btn:hover:not(:disabled) { background: #e07b00; }
        .buy-btn:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }

        .miners-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px 12px;
        }
        /* Компактные карточки майнеров */
        .miner-card {
            background: #252525;
            border-radius: 6px;
            padding: 7px 10px;
            margin-bottom: 6px;
            border-left: 3px solid #f7931a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .miner-card .left {
            display: flex;
            flex-direction: column;
        }
        .miner-card .title {
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 1px;
        }
        .miner-card .timer {
            color: #00ffcc;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .miner-card .status {
            font-size: 0.7rem;
            color: #888;
        }

        /* ===== ЦЕНТР ===== */
        .center-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            background: linear-gradient(180deg, #0f0f0f 0%, #151515 100%);
            overflow: hidden;
        }
        .balance {
            font-size: 2.8rem;
            font-weight: bold;
            color: #f7931a;
            margin: 8px 0 20px;
        }
        .stats {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 18px 26px;
            min-width: 320px;
        }
        .stats p {
            margin: 7px 0;
            font-size: 1rem;
        }
        .highlight { color: #00ffcc; }
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 8px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f7931a, #ffb347);
            transition: width 0.5s;
        }

        /* ===== ПРАВАЯ ПАНЕЛЬ (ЧАТ) ===== */
        .right-panel {
            background: #1a1a1a;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .right-panel h3 {
            color: #f7931a;
            padding: 12px 15px;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
            font-size: 1rem;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 15px;
        }
        .chat-msg {
            margin-bottom: 10px;
            font-size: 0.88rem;
            line-height: 1.35;
        }
        .chat-msg .author {
            color: #f7931a;
            font-weight: bold;
        }
        .chat-msg .time {
            color: #666;
            font-size: 0.72rem;
            margin-left: 5px;
        }
        .chat-input-area {
            padding: 10px 12px;
            border-top: 1px solid #333;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .chat-input-area input {
            flex: 1;
            background: #252525;
            border: 1px solid #444;
            color: white;
            padding: 9px 12px;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }
        .chat-input-area button {
            background: #f7931a;
            border: none;
            color: white;
            padding: 0 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Auth */
        #authBlock {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.93);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .connect-btn {
            background: #f7931a;
            color: white;
            border: none;
            padding: 15px 34px;
            font-size: 1.15rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 18px;
        }
        .connect-btn:hover { background: #e07b00; }
        .error { color: #ff5555; margin-top: 12px; }
        .wallet {
            color: #00ffcc;
            font-family: monospace;
            font-size: 0.9rem;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

    <div id="authBlock">
        <h1 style="color:#f7931a; font-size:2.4rem;">LIZABITCOIN</h1>
        <p style="margin-top:8px; color:#aaa;">Подключи MetaMask, чтобы начать майнить</p>
        <button class="connect-btn" onclick="connectMetaMask()">Подключить MetaMask</button>
        <p id="errorText" class="error"></p>
    </div>

    <div class="header" id="header" style="display:none;">
        <h1>LIZABITCOIN</h1>
        <div class="wallet" id="walletDisplay">-</div>
    </div>

    <div class="main" id="game" style="display:none;">
        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <div class="left-panel">
            <h3>Мои майнеры</h3>
            
            <div class="buy-section">
                <div>Цена: <strong id="minerPrice" class="highlight">40</strong> LIZA</div>
                <div style="font-size:0.78rem; color:#999; margin-top:2px;">80% от текущей награды</div>
                <button class="buy-btn" id="buyBtn" onclick="buyMiner()">Купить майнер</button>
            </div>

            <div class="miners-list" id="minersList"></div>
        </div>

        <!-- ЦЕНТР -->
        <div class="center-panel">
            <div style="color:#aaa; font-size:1rem;">Твой баланс</div>
            <div class="balance"><span id="balanceDisplay">0</span> LIZA</div>

            <div class="stats">
                <p>Награда за 10 мин: <strong id="rewardDisplay" class="highlight">50</strong> LIZA</p>
                <p>Всего добыто: <strong id="totalMinedDisplay">0</strong> / 21 000 000</p>
                <p>До халвинга: <strong id="nextHalvingDisplay">10.50M</strong> LIZA</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width:0%"></div>
                </div>
                <p style="font-size:0.82rem; color:#888; margin-top:7px;" id="eraInfo">Эра 1 • Награда 50 LIZA</p>
            </div>
        </div>

        <!-- ЧАТ -->
        <div class="right-panel">
            <h3>Чат майнеров</h3>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Написать сообщение..." maxlength="200" 
                       onkeydown="if(event.key==='Enter')sendChat()">
                <button onclick="sendChat()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbMP3oLBoPuz4jNpEJzs3aqfhv2nULZJk",
            authDomain: "lizatest-124da.firebaseapp.com",
            databaseURL: "https://lizatest-124da-default-rtdb.firebaseio.com",
            projectId: "lizatest-124da",
            storageBucket: "lizatest-124da.firebasestorage.app",
            messagingSenderId: "88106031938",
            appId: "1:88106031938:web:0b3b08517e71ce33aa06db",
            measurementId: "G-HT8D6XRFSY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const TOTAL_SUPPLY = 21000000;
        const CYCLE_MS = 10 * 60 * 1000; // 10 минут

        let myAddress = "";
        let myBalance = 0;
        let myMiners = [];
        let globalTotalMined = 0;
        let currentReward = 50;

        // ========== ХАЛВИНГИ ==========
        function getRewardInfo(totalMined) {
            if (totalMined >= TOTAL_SUPPLY) {
                return { reward: 0, era: 34, nextHalving: 0, progress: 100 };
            }

            let remaining = totalMined;
            let reward = 50;
            let era = 1;
            let eraSupply = 10500000;

            while (remaining >= eraSupply && reward > 0) {
                remaining -= eraSupply;
                reward /= 2;
                eraSupply /= 2;
                era++;
            }

            const nextHalving = eraSupply - remaining;
            const progress = (remaining / eraSupply) * 100;

            return { reward, era, nextHalving, progress };
        }

        function updateRewardInfo() {
            const info = getRewardInfo(globalTotalMined);
            currentReward = info.reward;

            document.getElementById('rewardDisplay').innerText = formatNum(currentReward);
            document.getElementById('totalMinedDisplay').innerText = formatNum(globalTotalMined);
            document.getElementById('nextHalvingDisplay').innerText = formatNum(Math.ceil(info.nextHalving));
            document.getElementById('progressFill').style.width = info.progress + '%';
            document.getElementById('eraInfo').innerText = `Эра ${info.era} • Награда ${formatNum(currentReward)} LIZA`;
            
            const price = +(currentReward * 0.8).toFixed(4);
            document.getElementById('minerPrice').innerText = formatNum(price);
            
            const buyBtn = document.getElementById('buyBtn');
            buyBtn.disabled = !(myBalance >= price && currentReward > 0);
        }

        // ========== ПОДКЛЮЧЕНИЕ ==========
        async function connectMetaMask() {
            const errorText = document.getElementById('errorText');
            errorText.innerText = "";

            if (typeof window.ethereum === 'undefined') {
                errorText.innerText = "MetaMask не найден";
                return;
            }

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                myAddress = accounts[0].toLowerCase();

                document.getElementById('authBlock').style.display = 'none';
                document.getElementById('header').style.display = 'flex';
                document.getElementById('game').style.display = 'grid';
                document.getElementById('walletDisplay').innerText = shortAddress(myAddress);

                // Пользователь
                const userRef = db.ref('users/' + myAddress);
                userRef.once('value').then(snap => {
                    if (!snap.exists()) {
                        const firstMiner = { id: Date.now(), lastPayout: Date.now() };
                        userRef.set({ balance: 0, miners: [firstMiner] });
                        myBalance = 0;
                        myMiners = [firstMiner];
                    } else {
                        const data = snap.val();
                        myBalance = data.balance || 0;
                        myMiners = data.miners || [];
                    }
                    renderMiners();
                    updateUI();
                });

                // Глобальный totalMined
                db.ref('global/totalMined').on('value', snap => {
                    globalTotalMined = snap.val() || 0;
                    updateRewardInfo();
                });

                // ЧАТ (исправлено)
                db.ref('chat').orderByChild('time').limitToLast(40).on('value', snap => {
                    renderChat(snap.val());
                });

                // Проверка выплат
                setInterval(checkPayouts, 1000);

            } catch (err) {
                console.error(err);
                errorText.innerText = "Ошибка подключения";
            }
        }

        // ========== МАЙНЕРЫ ==========
        function buyMiner() {
            const price = +(currentReward * 0.8).toFixed(4);
            if (myBalance < price || currentReward <= 0) return;

            myBalance = +(myBalance - price).toFixed(4);
            myMiners.push({
                id: Date.now() + Math.random(),
                lastPayout: Date.now()
            });

            saveUser();
            renderMiners();
            updateUI();

            // Прокручиваем список майнеров вниз к новому
            const list = document.getElementById('minersList');
            list.scrollTop = list.scrollHeight;
        }

        function checkPayouts() {
            if (!myAddress || myMiners.length === 0) return;

            let totalEarned = 0;
            let changed = false;
            const now = Date.now();

            myMiners.forEach(miner => {
                const elapsed = now - miner.lastPayout;
                const periods = Math.floor(elapsed / CYCLE_MS);
                if (periods > 0) {
                    totalEarned += periods * currentReward;
                    miner.lastPayout += periods * CYCLE_MS;
                    changed = true;
                }
            });

            if (changed && totalEarned > 0) {
                myBalance = +(myBalance + totalEarned).toFixed(4);

                db.ref('global/totalMined').transaction(current => {
                    return (current || 0) + totalEarned;
                });

                saveUser();
                updateUI();
            }

            renderMiners();
        }

        function renderMiners() {
            const list = document.getElementById('minersList');
            const scrollPos = list.scrollTop; // сохраняем позицию скролла

            list.innerHTML = '';

            if (myMiners.length === 0) {
                list.innerHTML = '<div style="color:#666; text-align:center; margin-top:30px; font-size:0.9rem;">Нет майнеров</div>';
                return;
            }

            const now = Date.now();
            myMiners.forEach((miner, index) => {
                const elapsed = now - miner.lastPayout;
                const left = CYCLE_MS - (elapsed % CYCLE_MS);
                const mins = Math.floor(left / 60000);
                const secs = Math.floor((left % 60000) / 1000);

                const div = document.createElement('div');
                div.className = 'miner-card';
                div.innerHTML = `
                    <div class="left">
                        <div class="title">Майнер #${index + 1}</div>
                        <div class="status">до выплаты</div>
                    </div>
                    <div class="timer">${mins}:${secs.toString().padStart(2, '0')}</div>
                `;
                list.appendChild(div);
            });

            // Восстанавливаем скролл (чтобы не прыгало)
            list.scrollTop = scrollPos;
        }

        function saveUser() {
            db.ref('users/' + myAddress).set({
                balance: myBalance,
                miners: myMiners
            });
        }

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = formatNum(myBalance);
            updateRewardInfo();
        }

        // ========== ЧАТ ==========
        function sendChat() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || !myAddress) return;

            db.ref('chat').push({
                user: shortAddress(myAddress),
                text: text,
                time: Date.now()
            });
            input.value = '';
        }

        function renderChat(messages) {
            const box = document.getElementById('chatMessages');
            box.innerHTML = '';
            if (!messages) return;

            const arr = Object.values(messages).sort((a, b) => a.time - b.time);
            arr.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'chat-msg';
                const time = new Date(msg.time).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
                div.innerHTML = `
                    <span class="author">${msg.user}</span>
                    <span class="time">${time}</span><br>
                    ${escapeHtml(msg.text)}
                `;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        // ========== УТИЛИТЫ ==========
        function shortAddress(addr) {
            return addr.slice(0, 6) + '...' + addr.slice(-4);
        }

        function formatNum(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
            if (Number.isInteger(n)) return n.toLocaleString('ru');
            return parseFloat(n.toFixed(4)).toLocaleString('ru');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
